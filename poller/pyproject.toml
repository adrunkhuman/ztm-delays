[project]
name = "ztm-gps-poller"
version = "0.1.0"
description = "Warsaw ZTM GPS poller that writes hourly Parquet files to GCS."
requires-python = ">=3.13"
dependencies = [
    "google-cloud-storage>=3.6.0",
    "pyarrow>=22.0.0",
    "requests>=2.32.5",
    "tzdata>=2026.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.0",
    "ty>=0.0.15",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203", "D213", "D100", "D104", "COM812", "ISC001", "E501",
  "EM101", "EM102", "TRY003", "G004", "T201", "FBT", "TD", "FIX", "ERA001", "CPY001"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "D", "SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ty.environment]
python-version = "3.13"
