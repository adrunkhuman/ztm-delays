[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ztm_frontend"]

[tool.setuptools.package-data]
ztm_frontend = ["templates/*.html", "static/*"]

[project]
name = "ztm-frontend"
version = "0.1.0"
description = "Server-rendered frontend for the ZTM serving DuckDB artifact."
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4.0",
    "flask>=3.1.0",
    "google-cloud-storage>=3.16.0",
    "pytz>=2025.2",
    "waitress>=3.0.2",
    "ztm-routing==0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.0",
    "ty>=0.0.15",
]

# Track frontend wheel contents; routing declares its own Rust-input cache keys.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "ztm_frontend/**/*.py" },
    { file = "ztm_frontend/templates/*.html" },
    { file = "ztm_frontend/static/*" },
]

[tool.uv.sources]
ztm-routing = { path = "../routing", editable = false }

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",
    "D213",
    "D100",
    "D104",
    "COM812",
    "ISC001",
    "E501",
    "EM101",
    "EM102",
    "TRY003",
    "G004",
    "T201",
    "FBT",
    "TD",
    "FIX",
    "ERA001",
    "CPY001",
]

[tool.ruff.lint.isort]
known-first-party = ["ztm_frontend", "ztm_routing"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "D"]
# Hand-run maintenance scripts, not an importable package.
"scripts/*.py" = ["INP001"]

[tool.ty.environment]
python-version = "3.13"
