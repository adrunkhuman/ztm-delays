<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="htmx-config" content='{"noSwap":[204,304,"4xx","5xx"]}'>
    <title>{% block title %}ZTM delays{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css', v=stylesheet_version) }}">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0-beta5/dist/htmx.min.js" integrity="sha384-5dnhUXCt1hXGvYrjAnKwgNX3I8xtIJiW6eIHIbeo7oWyXv2XpWYC/rl+ZiWfuYO5" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="page" class="page" hx-history-elt hx-boost:inherited="swap:outerSync select:#page target:#page" hx-indicator:inherited=".loadline">
      <div class="loadline" aria-hidden="true"></div>
      <nav class="nav">
        <a class="brand" href="{{ url_for('index', date=navigation_date) }}">ZTM<span>/delays</span></a>
        <div class="nav-links" aria-label="Main navigation">
          <a href="{{ url_for('index', date=navigation_date) }}" class="{% if request.endpoint == 'index' %}active{% endif %}">overview</a>
          <a href="{{ url_for('lines', date=navigation_date) }}" class="{% if request.endpoint == 'lines' %}active{% endif %}">lines</a>
          <a href="{{ url_for('stops', date=navigation_date) }}" class="{% if request.endpoint == 'stops' %}active{% endif %}">stops</a>
          <a href="{{ url_for('schedule', date=navigation_date) }}" class="{% if request.endpoint in ['schedule', 'trip_detail'] %}active{% endif %}">trips</a>
        </div>
        <div class="nav-actions">
          <a class="status-link" href="https://github.com/adrunkhuman/ztm-delays" aria-label="Project on GitHub" title="Project on GitHub">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
              <path d="M12 .297C5.37.297 0 5.67 0 12.297c0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.043-1.61-4.043-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.73.083-.73 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.807 1.305 3.492.998.108-.776.418-1.305.762-1.605-2.665-.3-5.467-1.334-5.467-5.93 0-1.31.467-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23a11.5 11.5 0 0 1 3-.404c1.02.005 2.045.138 3 .404 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
            </svg>
          </a>
          <a class="status-link {% if request.endpoint == 'status' %}active{% endif %}" href="{{ url_for('status', date=navigation_date) }}">status</a>
        </div>
      </nav>

      {% block body %}{% endblock %}

      <footer class="foot">
        {% block footer %}<span>archive · {{ meta.source_row_count|integer if meta.source_row_count else "n/a" }} rows · built {{ meta.exported_at or "n/a" }}</span>{% endblock %}
      </footer>
    </div>
    {% block scripts %}{% endblock %}
  </body>
</html>
