<ol class="pl-stop-list">
  <li class="pl-stop-head" aria-hidden="true"><span>expected</span><span></span><span>timetable</span></li>
  {% for s in stops %}
    <li class="{% if loop.first or loop.last %}pl-stop-end{% endif %}">
      <span class="mono">{% if s.differs %}<span class="pl-flag" title="timetable {{ s.scheduled|clock }}" aria-label="differs from timetable">!</span>{% endif %}{{ s.expected|clock }}</span>
      <span class="pl-stop-name">{{ s.stop_name }}</span>
      <span class="mono muted">{{ s.scheduled|clock }}</span>
    </li>
  {% endfor %}
</ol>
