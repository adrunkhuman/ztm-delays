<ol class="pl-stop-list">
  <li class="pl-stop-head" aria-hidden="true"><span>{{ t.expected }}</span><span></span><span>{{ t.timetable }}</span></li>
  {% for s in stops %}
    <li class="{% if loop.first or loop.last %}pl-stop-end{% endif %}">
      <span class="mono">{{ s.expected|clock }}{% if s.differs %}<span class="pl-flag" title="{{ t.timetable }} {{ s.scheduled|clock }}" aria-label="{{ t.differs }}">!</span>{% endif %}</span>
      <span class="pl-stop-name">{{ s.stop_name }}</span>
      <span class="mono muted">{{ s.scheduled|clock }}</span>
    </li>
  {% endfor %}
</ol>
