name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  poller:
    name: Poller
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: poller/uv.lock

      - name: Install poller dependencies
        run: uv sync --locked
        working-directory: poller

      - name: Lint poller
        run: uv run ruff check .
        working-directory: poller

      - name: Test poller
        run: uv run pytest
        working-directory: poller

  airflow:
    name: Airflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: airflow/pyproject.toml

      - name: Compile Airflow DAGs
        run: python -m py_compile airflow/dags/ztm_airflow_common.py airflow/dags/ztm_matcher.py airflow/dags/dag_gtfs_poll.py airflow/dags/dag_gtfs_load.py airflow/dags/dag_daily_gps.py airflow/dags/dag_serving_export.py

      - name: Lint Airflow
        run: uvx ruff check airflow

      - name: Test Airflow DAG boundaries
        run: uvx --with pytest --with tzdata --with duckdb --with pyarrow pytest airflow/tests

  matcher:
    name: Matcher
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: matcher/uv.lock

      - name: Install matcher dependencies
        run: uv sync --locked
        working-directory: matcher

      - name: Lint matcher
        run: uv run ruff check .
        working-directory: matcher

      - name: Type check matcher
        run: uv run ty check
        working-directory: matcher

      - name: Test matcher
        run: uv run pytest
        working-directory: matcher

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: frontend/uv.lock

      - name: Install frontend dependencies
        run: uv sync --locked
        working-directory: frontend

      - name: Lint frontend
        run: uv run ruff check .
        working-directory: frontend

      - name: Test frontend queries
        run: uv run pytest tests
        working-directory: frontend

  dbt:
    name: dbt
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: dbt/dbt_project.yml

      - name: Configure credential path
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Write GCP service account key
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$GCP_SERVICE_ACCOUNT_JSON"
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Install dbt
        run: |
          uv venv
          uv pip install dbt-core dbt-bigquery

      - name: Compile dbt warehouse models
        run: >-
          uv run dbt compile --profiles-dir .
          --select stg_gtfs__trips stg_gtfs__stop_times stg_gtfs__stops stg_gtfs__shapes stg_gtfs__routes stg_gtfs__calendar_dates int_gtfs_trip_schedule int_gtfs_duty_chain int_schedule_version int_serving_trip_universe dim_line dim_stop_post dim_stop_group dim_date dim_schedule_date dim_schedule_version dim_line_current dim_stop_post_current dim_stop_group_current dim_schedule_date_current dim_serving_date fct_trip fct_stop_arrival fct_expected_stop_event mart_day_completeness agg_service_coverage mart_pipeline_status mart_pipeline_status_recent_summary mart_mode_window_summary mart_line_window_summary mart_stop_group_window_summary mart_stop_post_window_summary mart_entity_rankings mart_entity_daily_summary mart_entity_timeline_daily mart_hour_window_summary mart_worst_delay_event mart_line_reliability_daily mart_trip_daily mart_trip_mode_daily_summary mart_trip_line_daily mart_line_trip_group_daily mart_line_course_window mart_line_course_stop_window mart_stop_line_window_summary mart_stop_post_line_group_window mart_stop_group_line_group_window rpt_schedule_day_mapping_evidence rpt_ranking_universe_evidence
          --vars '{"processing_date": "2026-01-15", "gtfs_snapshot_id": "snapshot-valid"}'
        working-directory: dbt

      - name: Check raw GPS schema contract
        run: python .github/scripts/check_raw_gps_contract.py

      - name: Run dbt unit tests
        run: >-
          uv run dbt test --profiles-dir .
          --select test_type:unit
          --vars '{"processing_date": "2026-01-15", "gtfs_snapshot_id": "snapshot-valid"}'
        working-directory: dbt

  deploy-vps:
    name: Deploy VPS
    runs-on: ubuntu-latest
    needs:
      - poller
      - airflow
      - matcher
      - frontend
      - dbt
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          ping: ${{ vars.VPS_DEPLOY_HOST || 'vps' }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.VPS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull and smoke-check VPS repo
        env:
          DEPLOY_HOST: ${{ vars.VPS_DEPLOY_HOST || 'vps' }}
          DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER || 'ubuntu' }}
          DEPLOY_REPO_DIR: ${{ vars.VPS_REPO_DIR || '/home/ubuntu/ztm-pipeline' }}
          DEPLOY_BRANCH: master
          AIRFLOW_CONTAINER_PREFIX: ${{ vars.AIRFLOW_CONTAINER_PREFIX || 'l11t1z4fvjlunhohvau5w8gc' }}
        run: |
          set -euo pipefail
          ssh_args=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_REPO_DIR' '$DEPLOY_BRANCH' '$AIRFLOW_CONTAINER_PREFIX'" \
            < .github/scripts/deploy_vps.sh
