name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  poller:
    name: Poller
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: poller/uv.lock

      - name: Install poller dependencies
        run: uv sync --locked
        working-directory: poller

      - name: Lint poller
        run: uv run ruff check .
        working-directory: poller

      - name: Test poller
        run: uv run pytest
        working-directory: poller

  airflow:
    name: Airflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: airflow/pyproject.toml

      - name: Compile Airflow DAGs
        run: python -m py_compile airflow/dags/ztm_airflow_common.py airflow/dags/ztm_matcher.py airflow/dags/dag_gtfs_poll.py airflow/dags/dag_gtfs_load.py airflow/dags/dag_daily_gps.py airflow/dags/dag_serving_export.py

      - name: Lint Airflow
        run: uvx ruff==0.15.21 check airflow

      - name: Test Airflow DAG boundaries
        run: >-
          uvx --with tzdata==2026.3 --with duckdb==1.5.4 --with pyarrow==25.0.0
          --with jinja2==3.1.6 pytest==9.1.1 airflow/tests

  airflow-image:
    name: Airflow image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build repository image
        run: |
          # Harmless canaries verify exclusions inside otherwise included source trees.
          for dir in airflow/dags dbt/models matcher/src/ztm_matcher; do
            touch "$dir/.env.image-smoke" "$dir/image-smoke.parquet"
          done
          docker build --platform linux/amd64 -f airflow/Dockerfile -t ztm-airflow:ci .
      - name: Smoke-test image offline
        run: >-
          docker run --rm --network none --entrypoint python
          -v "$PWD/.github/scripts/smoke_airflow_image.py:/tmp/smoke_airflow_image.py:ro"
          ztm-airflow:ci /tmp/smoke_airflow_image.py

  matcher:
    name: Matcher
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: matcher/uv.lock

      - name: Install matcher dependencies
        run: uv sync --locked
        working-directory: matcher

      - name: Lint matcher
        run: uv run ruff check .
        working-directory: matcher

      - name: Type check matcher
        run: uv run ty check
        working-directory: matcher

      - name: Test matcher
        run: uv run pytest
        working-directory: matcher

  offline-pipeline:
    name: Offline pipeline integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: integration_tests/uv.lock

      - name: Install locked integration dependencies
        run: uv sync --locked
        working-directory: integration_tests

      - name: Lint integration fixture
        run: uv run ruff check .
        working-directory: integration_tests

      - name: Test pipeline with networking disabled
        run: >-
          sudo -n unshare --net -- env PYTHONDONTWRITEBYTECODE=1
          "$PWD/integration_tests/.venv/bin/python" -m pytest -q -p no:cacheprovider
          integration_tests/test_offline_pipeline.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: frontend/uv.lock

      - name: Install frontend dependencies
        run: uv sync --locked
        working-directory: frontend

      - name: Lint frontend
        run: uv run ruff check .
        working-directory: frontend

      - name: Test frontend queries
        run: uv run pytest tests
        working-directory: frontend

  dbt:
    name: dbt
    # Fork PRs cannot access the cloud key; internal PRs retain full warehouse checks.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: dbt/dbt_project.yml

      - name: Configure credential path
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Write GCP service account key
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$GCP_SERVICE_ACCOUNT_JSON"
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Install dbt
        run: |
          uv venv
          uv pip install dbt-core==1.11.11 dbt-bigquery==1.11.3

      - name: Compile dbt warehouse models
        run: >-
          uv run dbt compile --profiles-dir .
          --select stg_gtfs__trips stg_gtfs__stop_times stg_gtfs__stops stg_gtfs__shapes stg_gtfs__routes stg_gtfs__calendar_dates int_gtfs_trip_schedule int_gtfs_duty_chain int_schedule_version int_serving_trip_stop_profile int_serving_trip_universe int_serving_observed_date int_serving_entity_window_summary dim_line dim_stop_post dim_stop_group dim_date dim_schedule_date dim_schedule_version dim_line_current dim_stop_post_current dim_stop_group_current dim_schedule_date_current dim_serving_date dim_serving_window_date fct_trip fct_stop_arrival fct_expected_stop_event mart_day_completeness agg_service_coverage mart_pipeline_status mart_pipeline_status_recent_summary mart_mode_window_summary mart_line_window_summary mart_stop_group_window_summary mart_stop_post_window_summary mart_entity_rankings mart_entity_daily_summary mart_entity_window_daily_summary mart_entity_timeline_daily mart_hour_window_summary mart_worst_delay_event mart_line_reliability_daily mart_trip_daily mart_trip_mode_daily_summary mart_trip_line_daily mart_line_trip_group_daily mart_line_course_window mart_line_course_stop_window mart_stop_line_window_summary mart_stop_post_line_group_window mart_stop_group_line_group_window rpt_schedule_day_mapping_evidence rpt_ranking_universe_evidence
          --vars '{"processing_date": "2026-01-15", "gtfs_snapshot_id": "snapshot-valid", "schedule_ledger_plan": []}'
        working-directory: dbt

      - name: Run dbt unit tests
        run: >-
          uv run dbt test --profiles-dir .
          --select test_type:unit
          --vars '{"processing_date": "2026-01-15", "gtfs_snapshot_id": "snapshot-valid", "schedule_ledger_plan": []}'
        working-directory: dbt

  deployment-checks:
    name: Schedule and deployment contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Test deployment
        run: uvx --with pyyaml==6.0.3 pytest==9.1.1 .github/tests
      - name: Lint deployment tests
        run: uvx ruff==0.15.21 check --isolated .github/tests .github/scripts/smoke_airflow_image.py
      - name: Compile pinned-date and no-change ledger plans offline
        run: |
          for plan in .github/fixtures/schedule-*.json; do
            uv run --no-project --python 3.13 --with dbt-core==1.11.11 --with dbt-bigquery==1.11.3 python dbt/tools/compile_schedule.py --vars-file "$plan"
          done
      - name: Check raw GPS schema contract
        run: python .github/scripts/check_raw_gps_contract.py
