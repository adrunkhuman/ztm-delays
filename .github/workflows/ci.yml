name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  poller:
    name: Poller
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: poller/uv.lock

      - name: Install poller dependencies
        run: uv sync --locked
        working-directory: poller

      - name: Lint poller
        run: uv run ruff check .
        working-directory: poller

      - name: Test poller
        run: uv run pytest
        working-directory: poller

  airflow:
    name: Airflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: airflow/pyproject.toml

      - name: Compile Airflow DAGs
        run: python -m py_compile airflow/dags/ztm_airflow_common.py airflow/dags/dag_gtfs_poll.py airflow/dags/dag_gtfs_load.py airflow/dags/dag_daily_gps.py airflow/dags/dag_serving_export.py

      - name: Lint Airflow
        run: uvx ruff check airflow

      - name: Test Airflow DAG boundaries
        run: uvx --with pytest --with tzdata --with duckdb pytest airflow/tests

  dbt:
    name: dbt
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: dbt/dbt_project.yml

      - name: Configure credential path
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Write GCP service account key
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$GCP_SERVICE_ACCOUNT_JSON"
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Install dbt
        run: |
          uv venv
          uv pip install dbt-core dbt-bigquery

      - name: Compile dbt warehouse models
        run: >-
          uv run dbt compile --profiles-dir .
          --select stg_gtfs__trips stg_gtfs__stop_times stg_gtfs__stops stg_gtfs__shapes stg_gtfs__routes stg_gtfs__calendar_dates int_ping_trip int_stop_arrivals int_gtfs_trip_schedule int_schedule_version int_trip_summary dim_line dim_stop_post dim_stop_group dim_date dim_schedule_date dim_schedule_version dim_line_current dim_stop_post_current dim_stop_group_current dim_schedule_date_current fct_trip fct_stop_arrival mart_day_completeness agg_service_coverage mart_pipeline_status agg_line_stop_period agg_stop_period agg_time_period agg_line_daily
          --vars '{"processing_date": "2026-01-15", "gtfs_snapshot_id": "snapshot-valid"}'
        working-directory: dbt

      - name: Run dbt unit tests
        run: >-
          uv run dbt test --profiles-dir .
          --select test_type:unit
          --vars '{"processing_date": "2026-01-15", "gtfs_snapshot_id": "snapshot-valid"}'
        working-directory: dbt
