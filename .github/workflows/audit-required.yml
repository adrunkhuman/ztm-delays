name: Audit Required

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  detect-audit-tier:
    name: Detect audit tier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report required audits
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          else
            base_sha="HEAD~1"
            head_sha="HEAD"
          fi

          git diff --name-only "$base_sha" "$head_sha" | python .github/scripts/audit_required.py
