[project]
name = "ztm-routing"
version = "0.1.0"
description = "Owned native routing engine for ZTM journey planning"
requires-python = ">=3.13"

[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "ztm_routing._native"
features = ["extension-module"]
locked = true

# Local dependencies otherwise ignore native source edits when reusing wheels.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "python/ztm_routing/*" },
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.13"
