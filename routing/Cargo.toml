[package]
name = "ztm-routing"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.29.3" }
rustc-hash = "=2.1.3"

[features]
extension-module = ["pyo3/extension-module"]

[lints.rust]
unsafe_code = "forbid"

# Search spans modules; optimize it as one unit rather than isolated partitions.
[profile.release]
codegen-units = 1
lto = "thin"
