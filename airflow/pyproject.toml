[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203", "D213", "D100", "D104", "COM812", "ISC001", "E501",
  "EM101", "EM102", "TRY003", "G004", "T201", "FBT", "TD", "FIX", "ERA001", "CPY001"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D", "SLF001", "PLR2004", "ARG", "ANN401", "N818", "PYI034"]
# The GTFS metadata query uses a module-level BigQuery table constant, not user input.
"dags/dag_gtfs_poll.py" = ["S608"]
# The GPS daily DAG queries GTFS metadata using module-level BigQuery table constants, not user input.
"dags/dag_daily_gps.py" = ["S608"]
# The serving export DAG queries fixed mart table names and metadata constants, not user input.
"dags/dag_serving_export.py" = ["S608"]
