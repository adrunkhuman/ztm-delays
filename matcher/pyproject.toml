[project]
name = "ztm-matcher"
version = "0.1.0"
description = "Bounded local runtime for Warsaw ZTM matching."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["duckdb>=1.4.0", "numpy>=2.0.0", "pyarrow>=22.0.0", "tzdata>=2026.2"]

[project.scripts]
ztm-matcher = "ztm_matcher.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9.0.0", "ruff>=0.15.0", "ty>=0.0.15"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.13"
