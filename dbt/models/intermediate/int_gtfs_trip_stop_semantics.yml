version: 2

models:
  - name: int_gtfs_trip_stop_semantics
    description: Trip-relative passenger and technical semantics for every operational GTFS stop row. Passenger boundaries settle only from explicit restrictions or high-confidence duty handoff evidence; ambiguous boundaries remain unknown.
    columns:
      - name: gtfs_snapshot_id
        tests: [not_null]
      - name: service_date
        tests: [not_null]
      - name: processing_date
        tests: [not_null]
      - name: trip_id
        tests: [not_null]
      - name: stop_id
        tests: [not_null]
      - name: stop_sequence
        tests: [not_null]
      - name: stop_execution_class
        description: Trip-relative execution role. Technical prefix/suffix rows remain operational duty evidence but are not passenger stops.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['passenger', 'technical_prefix', 'technical_suffix', 'technical_trip', 'unknown']
      - name: classification_confidence
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['high', 'medium', 'low']
      - name: classification_reason
        tests: [not_null]
      - name: classification_evidence
        tests: [not_null]
      - name: is_passenger_stop
        description: True only for a settled passenger stop row.
        tests: [not_null]
      - name: are_passenger_boundaries_settled
        tests: [not_null]
      - name: first_passenger_stop_sequence
        description: First settled passenger stop. Null when either boundary is unknown or the trip is wholly technical.
      - name: last_passenger_stop_sequence
        description: Last settled passenger stop. Null when either boundary is unknown or the trip is wholly technical.

unit_tests:
  - name: int_gtfs_trip_stop_semantics_infers_exact_block_handoff_suffix
    model: int_gtfs_trip_stop_semantics
    overrides:
      vars:
        gtfs_snapshot_id: snapshot-valid
        technical_terminal_movement_max_m: 250
    given:
      - input: ref('int_gtfs_duty_chain')
        format: sql
        rows: |
          select date '2026-07-09' as service_date, date '2026-07-09' as processing_date, 'snapshot-valid' as gtfs_snapshot_id, 'trip-145-a' as trip_id, 'duty-145-8' as duty_chain_id, 'block_id' as duty_chain_source, 'block-145-8' as duty_chain_source_id, 1 as trip_order, cast(null as string) as previous_trip_id, 'trip-145-b' as next_trip_id, cast(null as int64) as layover_from_previous_seconds, 600 as layover_to_next_seconds, false as is_depot_segment
          union all select date '2026-07-09', date '2026-07-09', 'snapshot-valid', 'trip-145-b', 'duty-145-8', 'block_id', 'block-145-8', 2, 'trip-145-a', cast(null as string), 600, cast(null as int64), false
      - input: ref('stg_gtfs__stop_times')
        format: sql
        rows: |
          select 'trip-145-a' as trip_id, '100101' as stop_id, 0 as stop_sequence, 36000 as arrival_time_seconds, 36000 as departure_time_seconds, 0 as pickup_type, 0 as drop_off_type, 'regular' as stop_service_class, 'snapshot-valid' as gtfs_snapshot_id
          union all select 'trip-145-a', '400123', 1, 36600, 36600, 0, 0, 'regular', 'snapshot-valid'
          union all select 'trip-145-a', '400116', 2, 36660, 36660, 0, 0, 'regular', 'snapshot-valid'
          union all select 'trip-145-b', '400116', 0, 37260, 37260, 0, 0, 'regular', 'snapshot-valid'
          union all select 'trip-145-b', '200101', 1, 37800, 37800, 0, 0, 'regular', 'snapshot-valid'
      - input: ref('stg_gtfs__stops')
        format: sql
        rows: |
          select '100101' as stop_id, 52.2500 as stop_lat, 21.0000 as stop_lon, 'snapshot-valid' as gtfs_snapshot_id
          union all select '400123', 52.2510, 21.0010, 'snapshot-valid'
          union all select '400116', 52.2515, 21.0015, 'snapshot-valid'
          union all select '200101', 52.2600, 21.0100, 'snapshot-valid'
    expect:
      rows:
        - trip_id: trip-145-a
          stop_sequence: 0
          stop_execution_class: passenger
          is_passenger_stop: true
          first_passenger_stop_sequence: 0
          last_passenger_stop_sequence: 1
        - trip_id: trip-145-a
          stop_sequence: 1
          stop_execution_class: passenger
          is_passenger_stop: true
          first_passenger_stop_sequence: 0
          last_passenger_stop_sequence: 1
        - trip_id: trip-145-a
          stop_sequence: 2
          stop_execution_class: technical_suffix
          is_passenger_stop: false
          first_passenger_stop_sequence: 0
          last_passenger_stop_sequence: 1
        - trip_id: trip-145-b
          stop_sequence: 0
          stop_execution_class: passenger
          is_passenger_stop: true
          first_passenger_stop_sequence: 0
          last_passenger_stop_sequence: 1
        - trip_id: trip-145-b
          stop_sequence: 1
          stop_execution_class: passenger
          is_passenger_stop: true
          first_passenger_stop_sequence: 0
          last_passenger_stop_sequence: 1

  - name: int_gtfs_trip_stop_semantics_preserves_explicit_and_ordinary_patterns
    model: int_gtfs_trip_stop_semantics
    overrides:
      vars:
        gtfs_snapshot_id: snapshot-valid
    given:
      - input: ref('int_gtfs_duty_chain')
        format: sql
        rows: |
          select date '2026-01-15' as service_date, date '2026-01-15' as processing_date, 'snapshot-valid' as gtfs_snapshot_id, 'explicit-boundaries' as trip_id, 'duty-a' as duty_chain_id, 'block_id' as duty_chain_source, 'block-a' as duty_chain_source_id, 1 as trip_order, cast(null as string) as previous_trip_id, cast(null as string) as next_trip_id, cast(null as int64) as layover_from_previous_seconds, cast(null as int64) as layover_to_next_seconds, false as is_depot_segment
          union all select date '2026-01-15', date '2026-01-15', 'snapshot-valid', 'ordinary-tram', 'duty-b', 'block_id', 'block-b', 1, cast(null as string), cast(null as string), cast(null as int64), cast(null as int64), false
          union all select date '2026-01-15', date '2026-01-15', 'snapshot-valid', 'technical-trip', 'duty-c', 'block_id', 'block-c', 1, cast(null as string), cast(null as string), cast(null as int64), cast(null as int64), false
      - input: ref('stg_gtfs__stop_times')
        format: sql
        rows: |
          select 'explicit-boundaries' as trip_id, 'A001' as stop_id, 0 as stop_sequence, 36000 as arrival_time_seconds, 36000 as departure_time_seconds, 1 as pickup_type, 1 as drop_off_type, 'not_in_passenger_service' as stop_service_class, 'snapshot-valid' as gtfs_snapshot_id
          union all select 'explicit-boundaries', 'A002', 1, 36100, 36100, 0, 0, 'regular', 'snapshot-valid'
          union all select 'explicit-boundaries', 'A003', 2, 36200, 36200, 1, 1, 'not_in_passenger_service', 'snapshot-valid'
          union all select 'ordinary-tram', 'T001', 0, 37000, 37000, 0, 0, 'regular', 'snapshot-valid'
          union all select 'ordinary-tram', 'T002', 1, 37100, 37100, 0, 0, 'regular', 'snapshot-valid'
          union all select 'technical-trip', 'D001', 0, 38000, 38000, 1, 1, 'not_in_passenger_service', 'snapshot-valid'
          union all select 'technical-trip', 'D002', 1, 38100, 38100, 1, 1, 'not_in_passenger_service', 'snapshot-valid'
      - input: ref('stg_gtfs__stops')
        format: sql
        rows: |
          select 'A001' as stop_id, 52.20 as stop_lat, 21.00 as stop_lon, 'snapshot-valid' as gtfs_snapshot_id
          union all select 'A002', 52.21, 21.01, 'snapshot-valid'
          union all select 'A003', 52.22, 21.02, 'snapshot-valid'
          union all select 'T001', 52.23, 21.03, 'snapshot-valid'
          union all select 'T002', 52.24, 21.04, 'snapshot-valid'
          union all select 'D001', 52.25, 21.05, 'snapshot-valid'
          union all select 'D002', 52.26, 21.06, 'snapshot-valid'
    expect:
      rows:
        - trip_id: explicit-boundaries
          stop_sequence: 0
          stop_execution_class: technical_prefix
          is_passenger_stop: false
          first_passenger_stop_sequence: 1
          last_passenger_stop_sequence: 1
        - trip_id: explicit-boundaries
          stop_sequence: 1
          stop_execution_class: passenger
          is_passenger_stop: true
          first_passenger_stop_sequence: 1
          last_passenger_stop_sequence: 1
        - trip_id: explicit-boundaries
          stop_sequence: 2
          stop_execution_class: technical_suffix
          is_passenger_stop: false
          first_passenger_stop_sequence: 1
          last_passenger_stop_sequence: 1
        - trip_id: ordinary-tram
          stop_sequence: 0
          stop_execution_class: passenger
          is_passenger_stop: true
          first_passenger_stop_sequence: 0
          last_passenger_stop_sequence: 1
        - trip_id: ordinary-tram
          stop_sequence: 1
          stop_execution_class: passenger
          is_passenger_stop: true
          first_passenger_stop_sequence: 0
          last_passenger_stop_sequence: 1
        - trip_id: technical-trip
          stop_sequence: 0
          stop_execution_class: technical_trip
          is_passenger_stop: false
          first_passenger_stop_sequence: null
          last_passenger_stop_sequence: null
        - trip_id: technical-trip
          stop_sequence: 1
          stop_execution_class: technical_trip
          is_passenger_stop: false
          first_passenger_stop_sequence: null
          last_passenger_stop_sequence: null

  - name: int_gtfs_trip_stop_semantics_handles_prefix_depot_and_no_handoff
    model: int_gtfs_trip_stop_semantics
    overrides:
      vars:
        gtfs_snapshot_id: snapshot-valid
    given:
      - input: ref('int_gtfs_duty_chain')
        format: sql
        rows: |
          select date '2026-01-15' as service_date, date '2026-01-15' as processing_date, 'snapshot-valid' as gtfs_snapshot_id, 'previous-trip' as trip_id, 'duty-prefix' as duty_chain_id, 'block_id' as duty_chain_source, 'block-prefix' as duty_chain_source_id, 1 as trip_order, cast(null as string) as previous_trip_id, 'prefix-trip' as next_trip_id, cast(null as int64) as layover_from_previous_seconds, 300 as layover_to_next_seconds, false as is_depot_segment
          union all select date '2026-01-15', date '2026-01-15', 'snapshot-valid', 'prefix-trip', 'duty-prefix', 'block_id', 'block-prefix', 2, 'previous-trip', cast(null as string), 300, cast(null as int64), false
          union all select date '2026-01-15', date '2026-01-15', 'snapshot-valid', 'depot-trip', 'duty-depot', 'block_id', 'block-depot', 1, cast(null as string), cast(null as string), cast(null as int64), cast(null as int64), true
          union all select date '2026-01-15', date '2026-01-15', 'snapshot-valid', 'no-handoff', 'duty-single', 'block_id', 'block-single', 1, cast(null as string), cast(null as string), cast(null as int64), cast(null as int64), false
      - input: ref('stg_gtfs__stop_times')
        format: sql
        rows: |
          select 'previous-trip' as trip_id, '700101' as stop_id, 0 as stop_sequence, 35000 as arrival_time_seconds, 35000 as departure_time_seconds, 0 as pickup_type, 0 as drop_off_type, 'regular' as stop_service_class, 'snapshot-valid' as gtfs_snapshot_id
          union all select 'previous-trip', '800116', 1, 35400, 35400, 0, 0, 'regular', 'snapshot-valid'
          union all select 'prefix-trip', '800116', 0, 35700, 35700, 0, 0, 'regular', 'snapshot-valid'
          union all select 'prefix-trip', '800123', 1, 35760, 35760, 0, 0, 'regular', 'snapshot-valid'
          union all select 'prefix-trip', '900101', 2, 36300, 36300, 0, 0, 'regular', 'snapshot-valid'
          union all select 'depot-trip', 'D001', 0, 37000, 37000, 0, 0, 'regular', 'snapshot-valid'
          union all select 'depot-trip', 'D002', 1, 37100, 37100, 0, 0, 'regular', 'snapshot-valid'
          union all select 'no-handoff', 'N001', 0, 38000, 38000, 0, 0, 'regular', 'snapshot-valid'
          union all select 'no-handoff', 'N002', 1, 38100, 38100, 0, 0, 'regular', 'snapshot-valid'
      - input: ref('stg_gtfs__stops')
        format: sql
        rows: |
          select '700101' as stop_id, 52.20 as stop_lat, 21.00 as stop_lon, 'snapshot-valid' as gtfs_snapshot_id
          union all select '800116', 52.2100, 21.0100, 'snapshot-valid'
          union all select '800123', 52.2105, 21.0105, 'snapshot-valid'
          union all select '900101', 52.2200, 21.0200, 'snapshot-valid'
          union all select 'D001', 52.23, 21.03, 'snapshot-valid'
          union all select 'D002', 52.24, 21.04, 'snapshot-valid'
          union all select 'N001', 52.25, 21.05, 'snapshot-valid'
          union all select 'N002', 52.26, 21.06, 'snapshot-valid'
    expect:
      rows:
        - trip_id: previous-trip
          stop_sequence: 0
          stop_execution_class: passenger
          is_passenger_stop: true
          first_passenger_stop_sequence: 0
          last_passenger_stop_sequence: 1
        - trip_id: previous-trip
          stop_sequence: 1
          stop_execution_class: passenger
          is_passenger_stop: true
          first_passenger_stop_sequence: 0
          last_passenger_stop_sequence: 1
        - trip_id: prefix-trip
          stop_sequence: 0
          stop_execution_class: technical_prefix
          is_passenger_stop: false
          first_passenger_stop_sequence: 1
          last_passenger_stop_sequence: 2
        - trip_id: prefix-trip
          stop_sequence: 1
          stop_execution_class: passenger
          is_passenger_stop: true
          first_passenger_stop_sequence: 1
          last_passenger_stop_sequence: 2
        - trip_id: prefix-trip
          stop_sequence: 2
          stop_execution_class: passenger
          is_passenger_stop: true
          first_passenger_stop_sequence: 1
          last_passenger_stop_sequence: 2
        - trip_id: depot-trip
          stop_sequence: 0
          stop_execution_class: technical_trip
          is_passenger_stop: false
          first_passenger_stop_sequence: null
          last_passenger_stop_sequence: null
        - trip_id: depot-trip
          stop_sequence: 1
          stop_execution_class: technical_trip
          is_passenger_stop: false
          first_passenger_stop_sequence: null
          last_passenger_stop_sequence: null
        - trip_id: no-handoff
          stop_sequence: 0
          stop_execution_class: passenger
          is_passenger_stop: true
          first_passenger_stop_sequence: 0
          last_passenger_stop_sequence: 1
        - trip_id: no-handoff
          stop_sequence: 1
          stop_execution_class: passenger
          is_passenger_stop: true
          first_passenger_stop_sequence: 0
          last_passenger_stop_sequence: 1

  - name: int_gtfs_trip_stop_semantics_keeps_weak_handoffs_unknown
    model: int_gtfs_trip_stop_semantics
    overrides:
      vars:
        gtfs_snapshot_id: snapshot-valid
    given:
      - input: ref('int_gtfs_duty_chain')
        format: sql
        rows: |
          select date '2026-01-15' as service_date, date '2026-01-15' as processing_date, 'snapshot-valid' as gtfs_snapshot_id, 'weak-a' as trip_id, 'duty-weak' as duty_chain_id, 'line_brigade' as duty_chain_source, '145:8' as duty_chain_source_id, 1 as trip_order, cast(null as string) as previous_trip_id, 'weak-b' as next_trip_id, cast(null as int64) as layover_from_previous_seconds, 300 as layover_to_next_seconds, false as is_depot_segment
          union all select date '2026-01-15', date '2026-01-15', 'snapshot-valid', 'weak-b', 'duty-weak', 'line_brigade', '145:8', 2, 'weak-a', cast(null as string), 300, cast(null as int64), false
      - input: ref('stg_gtfs__stop_times')
        format: sql
        rows: |
          select 'weak-a' as trip_id, '500123' as stop_id, 0 as stop_sequence, 36000 as arrival_time_seconds, 36000 as departure_time_seconds, 0 as pickup_type, 0 as drop_off_type, 'regular' as stop_service_class, 'snapshot-valid' as gtfs_snapshot_id
          union all select 'weak-a', '500116', 1, 36100, 36100, 0, 0, 'regular', 'snapshot-valid'
          union all select 'weak-b', '500116', 0, 36400, 36400, 0, 0, 'regular', 'snapshot-valid'
          union all select 'weak-b', '600101', 1, 37000, 37000, 0, 0, 'regular', 'snapshot-valid'
      - input: ref('stg_gtfs__stops')
        format: sql
        rows: |
          select '500123' as stop_id, 52.2500 as stop_lat, 21.0000 as stop_lon, 'snapshot-valid' as gtfs_snapshot_id
          union all select '500116', 52.2505, 21.0005, 'snapshot-valid'
          union all select '600101', 52.2600, 21.0100, 'snapshot-valid'
    expect:
      rows:
        - trip_id: weak-a
          stop_sequence: 0
          stop_execution_class: passenger
          is_passenger_stop: false
          are_passenger_boundaries_settled: false
          first_passenger_stop_sequence: null
          last_passenger_stop_sequence: null
        - trip_id: weak-a
          stop_sequence: 1
          stop_execution_class: unknown
          is_passenger_stop: false
          are_passenger_boundaries_settled: false
          first_passenger_stop_sequence: null
          last_passenger_stop_sequence: null
        - trip_id: weak-b
          stop_sequence: 0
          stop_execution_class: passenger
          is_passenger_stop: true
          are_passenger_boundaries_settled: true
          first_passenger_stop_sequence: 0
          last_passenger_stop_sequence: 1
        - trip_id: weak-b
          stop_sequence: 1
          stop_execution_class: passenger
          is_passenger_stop: true
          are_passenger_boundaries_settled: true
          first_passenger_stop_sequence: 0
          last_passenger_stop_sequence: 1
