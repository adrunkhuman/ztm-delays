version: 2

models:
  - name: int_duty_execution
    description: >
      Ownership-independent scheduled-course execution spine. Raw GPS is settled from ordered passenger-terminal
      origin, departure, and destination evidence, not scheduled time windows or downstream ping ownership. A
      shared handoff terminal closes the previous course and starts the next course after that raw ping.
    columns:
      - name: service_date
        description: GTFS service date for the scheduled course. It can precede processing_date for overnight service.
        tests: [not_null]
      - name: processing_date
        description: Warsaw-local GPS date rebuilt by this partition.
        tests: [not_null]
      - name: gtfs_snapshot_id
        description: Governing GTFS snapshot for the duty-chain schedule.
        tests: [not_null]
      - name: duty_chain_id
        description: Stable selected duty-chain identity.
        tests: [not_null]
      - name: duty_chain_source
        description: Duty identity source. line_brigade evidence is retained but has lower confidence than block_id.
        tests:
          - accepted_values:
              arguments:
                values: ['block_id', 'line_brigade']
      - name: duty_chain_source_id
        description: Raw block or line-brigade identity before hashing.
        tests: [not_null]
      - name: trip_order
        description: Scheduled course order within the duty chain.
        tests: [not_null]
      - name: trip_id
        description: Scheduled GTFS trip identifier. Together with schedule lineage this is the course key.
        tests: [not_null]
      - name: vehicle_number
        description: Sole vehicle with settled terminal progression. Null for missed, uncertain, and multi-vehicle courses.
      - name: observed_start_time
        description: First source ping after the deterministic ownership lower bound.
      - name: observed_end_time
        description: Last source ping at or before the first confirmed destination terminal.
      - name: source_ping_start_time
        description: Explicit lower source-ping evidence bound. Null when no terminal progression was settled.
      - name: source_ping_end_time
        description: Explicit upper source-ping evidence bound. Null when no terminal progression was settled.
      - name: source_ping_count
        description: Number of raw line-matched pings inside the settled ownership interval.
        tests: [not_null]
      - name: execution_status
        description: >
          executed has one vehicle with origin-departure-destination evidence; missed has no matching line observation;
          skipped has settled adjacent courses; short_turned reaches the next line-changing course origin without this
          course's destination; vehicle_swap has multiple terminal-progressed vehicles; uncertain keeps unresolved
          terminal or passenger-boundary evidence explicit.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['executed', 'missed', 'skipped', 'short_turned', 'vehicle_swap', 'uncertain']
      - name: confidence
        description: Conservative execution confidence. line_brigade fallback is low even when terminal progression exists.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['high', 'medium', 'low']
      - name: execution_reason
        description: Stable primary reason code for execution_status.
        tests: [not_null]
      - name: execution_evidence
        description: Stable supporting evidence flags, independent of downstream ping-to-course ownership.
        tests: [not_null]
      - name: ownership_interval_start_time
        description: Inclusive lower raw-ping ownership bound for one settled executed course. Short turns remain unowned.
      - name: ownership_interval_end_time
        description: Inclusive upper raw-ping ownership bound, cut at the first confirmed destination terminal.

