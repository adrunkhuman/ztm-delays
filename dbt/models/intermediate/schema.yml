            date '2026-01-15' as gps_date,
            gps_hour,
            vehicle_type
          from unnest(generate_timestamp_array(
            timestamp(date '2026-01-15', 'Europe/Warsaw'),
            timestamp_sub(timestamp(date_add(date '2026-01-15', interval 1 day), 'Europe/Warsaw'), interval 1 hour),
            interval 1 hour
          )) as gps_hour
          cross join unnest([1, 2]) as vehicle_type
        )
        select
          gps_date,
          gps_hour,
          vehicle_type,
          case
            when gps_hour = timestamp('2026-01-15 09:00:00+00:00') and vehicle_type = 1
              then timestamp('2026-01-15 09:00:01+00:00')
            when gps_hour = timestamp('2026-01-15 10:00:00+00:00') and vehicle_type = 2
              then timestamp('2026-01-15 10:00:00+00:00')
          end as first_gps_time,
          case
            when gps_hour = timestamp('2026-01-15 09:00:00+00:00') and vehicle_type = 1
              then timestamp('2026-01-15 09:00:11+00:00')
            when gps_hour = timestamp('2026-01-15 10:00:00+00:00') and vehicle_type = 2
              then timestamp('2026-01-15 10:00:00+00:00')
          end as last_gps_time,
          case
            when gps_hour = timestamp('2026-01-15 09:00:00+00:00') and vehicle_type = 1 then 3
            when gps_hour = timestamp('2026-01-15 10:00:00+00:00') and vehicle_type = 2 then 1
            else 0
          end as row_count,
          case
            when gps_hour = timestamp('2026-01-15 09:00:00+00:00') and vehicle_type = 1 then 2
            when gps_hour = timestamp('2026-01-15 10:00:00+00:00') and vehicle_type = 2 then 1
            else 0
          end as vehicle_count,
          case
            when gps_hour = timestamp('2026-01-15 09:00:00+00:00') and vehicle_type = 1 then 2
            when gps_hour = timestamp('2026-01-15 10:00:00+00:00') and vehicle_type = 2 then 1
            else 0
          end as observed_10s_buckets,
          360 as expected_10s_buckets,
          case
            when gps_hour = timestamp('2026-01-15 09:00:00+00:00') and vehicle_type = 1 then 2 / 360
            when gps_hour = timestamp('2026-01-15 10:00:00+00:00') and vehicle_type = 2 then 1 / 360
            else 0
          end as coverage_ratio,
          case
            when gps_hour = timestamp('2026-01-15 09:00:00+00:00') and vehicle_type = 1 then 3589
            else 3600
          end as max_gap_seconds
        from expected_hours
