version: 2

models:
  - name: int_ping_trip
    description: GPS pings matched to one scheduled GTFS trip per vehicle and GPS timestamp. The model processes one Warsaw-local GPS date at a time, but can match the previous GTFS service date for overnight trips whose GTFS times exceed 24h. When overlapping trip windows match, the trip with the latest start time wins.
    columns:
      - name: line
        tests:
          - not_null
      - name: brigade
        tests:
          - not_null
      - name: gps_time
        tests:
          - not_null
      - name: vehicle_number
        tests:
          - not_null
      - name: gps_date
        tests:
          - not_null
      - name: trip_id
        tests:
          - not_null
      - name: shape_id
        tests:
          - not_null
      - name: service_id
        tests:
          - not_null
      - name: direction_id
        tests:
          - not_null
      - name: service_date
        tests:
          - not_null
      - name: day_type
        tests:
          - not_null
      - name: trip_start_seconds
        tests:
          - not_null
      - name: trip_end_seconds
        tests:
          - not_null
      - name: gps_time_seconds
        tests:
          - not_null

unit_tests:
  - name: int_ping_trip_matches_sequential_trips_for_same_brigade
    model: int_ping_trip
    overrides:
      vars:
        processing_date: '2026-01-15'
        gtfs_snapshot_id: 'snapshot-valid'
    given:
      - input: ref('stg_gps_pings')
        format: sql
        rows: |
          select '187' as line, '12' as brigade, 52.1 as lat, 21.1 as lon, timestamp('2026-01-15 10:15:00+00:00') as gps_time, '1001' as vehicle_number, 1 as vehicle_type, timestamp('2026-01-15 10:15:10+00:00') as ingested_at, date '2026-01-15' as gps_date
          union all select '187', '12', 52.2, 21.2, timestamp('2026-01-15 11:15:00+00:00'), '1001', 1, timestamp('2026-01-15 11:15:10+00:00'), date '2026-01-15'
          union all select '187', '12', 52.3, 21.3, timestamp('2026-01-15 08:50:00+00:00'), '1001', 1, timestamp('2026-01-15 08:50:10+00:00'), date '2026-01-15'
      - input: ref('stg_gtfs_trips')
        format: sql
        rows: |
          select 'trip-morning' as trip_id, '187' as line, 'svc-weekday' as service_id, 'Morning' as trip_headsign, 0 as direction_id, '12' as brigade, 'shape-morning' as shape_id, 'snapshot-valid' as gtfs_snapshot_id
          union all select 'trip-midday', '187', 'svc-weekday', 'Midday', 1, '12', 'shape-midday', 'snapshot-valid'
      - input: ref('stg_gtfs_stop_times')
        format: sql
        rows: |
          select 'trip-morning' as trip_id, 'stop-1' as stop_id, 1 as stop_sequence, 36000 as arrival_time_seconds, 36000 as departure_time_seconds, 'snapshot-valid' as gtfs_snapshot_id
          union all select 'trip-morning', 'stop-2', 2, 41400, 41400, 'snapshot-valid'
          union all select 'trip-midday', 'stop-3', 1, 43200, 43200, 'snapshot-valid'
          union all select 'trip-midday', 'stop-4', 2, 46800, 46800, 'snapshot-valid'
      - input: ref('stg_gtfs_calendar_dates')
        format: sql
        rows: |
          select 'svc-weekday' as service_id, date '2026-01-15' as service_date, 1 as exception_type, 'weekday' as day_type, 'snapshot-valid' as gtfs_snapshot_id
    expect:
      rows:
        - line: '187'
          brigade: '12'
          lat: 52.1
          lon: 21.1
          gps_time: '2026-01-15 10:15:00+00:00'
          vehicle_number: '1001'
          vehicle_type: 1
          ingested_at: '2026-01-15 10:15:10+00:00'
          gps_date: '2026-01-15'
          trip_id: 'trip-morning'
          shape_id: 'shape-morning'
          service_id: 'svc-weekday'
          direction_id: 0
          service_date: '2026-01-15'
          day_type: 'weekday'
          trip_start_seconds: 36000
          trip_end_seconds: 41400
          gps_time_seconds: 40500
        - line: '187'
          brigade: '12'
          lat: 52.2
          lon: 21.2
          gps_time: '2026-01-15 11:15:00+00:00'
          vehicle_number: '1001'
          vehicle_type: 1
          ingested_at: '2026-01-15 11:15:10+00:00'
          gps_date: '2026-01-15'
          trip_id: 'trip-midday'
          shape_id: 'shape-midday'
          service_id: 'svc-weekday'
          direction_id: 1
          service_date: '2026-01-15'
          day_type: 'weekday'
          trip_start_seconds: 43200
          trip_end_seconds: 46800
          gps_time_seconds: 44100

  - name: int_ping_trip_matches_previous_service_date_overnight_trip
    model: int_ping_trip
    overrides:
      vars:
        processing_date: '2026-01-15'
        gtfs_snapshot_id: 'snapshot-valid'
    given:
      - input: ref('stg_gps_pings')
        format: sql
        rows: |
          select '517' as line, '7' as brigade, 52.1 as lat, 21.1 as lon, timestamp('2026-01-14 23:30:00+00:00') as gps_time, '2001' as vehicle_number, 1 as vehicle_type, timestamp('2026-01-14 23:30:10+00:00') as ingested_at, date '2026-01-15' as gps_date
      - input: ref('stg_gtfs_trips')
        format: sql
        rows: |
          select 'trip-night' as trip_id, '517' as line, 'svc-night' as service_id, 'Night' as trip_headsign, 0 as direction_id, '7' as brigade, 'shape-night' as shape_id, 'snapshot-valid' as gtfs_snapshot_id
      - input: ref('stg_gtfs_stop_times')
        format: sql
        rows: |
          select 'trip-night' as trip_id, 'stop-1' as stop_id, 1 as stop_sequence, 86400 as arrival_time_seconds, 86400 as departure_time_seconds, 'snapshot-valid' as gtfs_snapshot_id
          union all select 'trip-night', 'stop-2', 2, 90000, 90000, 'snapshot-valid'
      - input: ref('stg_gtfs_calendar_dates')
        format: sql
        rows: |
          select 'svc-night' as service_id, date '2026-01-14' as service_date, 1 as exception_type, 'weekday' as day_type, 'snapshot-valid' as gtfs_snapshot_id
    expect:
      rows:
        - line: '517'
          brigade: '7'
          lat: 52.1
          lon: 21.1
          gps_time: '2026-01-14 23:30:00+00:00'
          vehicle_number: '2001'
          vehicle_type: 1
          ingested_at: '2026-01-14 23:30:10+00:00'
          gps_date: '2026-01-15'
          trip_id: 'trip-night'
          shape_id: 'shape-night'
          service_id: 'svc-night'
          direction_id: 0
          service_date: '2026-01-14'
          day_type: 'weekday'
          trip_start_seconds: 86400
          trip_end_seconds: 90000
          gps_time_seconds: 88200

  - name: int_ping_trip_ignores_previous_gps_partition
    model: int_ping_trip
    overrides:
      vars:
        processing_date: '2026-01-15'
        gtfs_snapshot_id: 'snapshot-valid'
    given:
      - input: ref('stg_gps_pings')
        format: sql
        rows: |
          select '187' as line, '12' as brigade, 52.1 as lat, 21.1 as lon, timestamp('2026-01-14 10:30:00+00:00') as gps_time, '1001' as vehicle_number, 1 as vehicle_type, timestamp('2026-01-14 10:30:10+00:00') as ingested_at, date '2026-01-14' as gps_date
      - input: ref('stg_gtfs_trips')
        format: sql
        rows: |
          select 'trip-previous' as trip_id, '187' as line, 'svc-previous' as service_id, 'Previous' as trip_headsign, 0 as direction_id, '12' as brigade, 'shape-previous' as shape_id, 'snapshot-valid' as gtfs_snapshot_id
      - input: ref('stg_gtfs_stop_times')
        format: sql
        rows: |
          select 'trip-previous' as trip_id, 'stop-1' as stop_id, 1 as stop_sequence, 40000 as arrival_time_seconds, 40000 as departure_time_seconds, 'snapshot-valid' as gtfs_snapshot_id
          union all select 'trip-previous', 'stop-2', 2, 43000, 43000, 'snapshot-valid'
      - input: ref('stg_gtfs_calendar_dates')
        format: sql
        rows: |
          select 'svc-previous' as service_id, date '2026-01-14' as service_date, 1 as exception_type, 'weekday' as day_type, 'snapshot-valid' as gtfs_snapshot_id
    expect:
      rows: []

  - name: int_ping_trip_prefers_latest_absolute_trip_start
    model: int_ping_trip
    overrides:
      vars:
        processing_date: '2026-01-15'
        gtfs_snapshot_id: 'snapshot-valid'
    given:
      - input: ref('stg_gps_pings')
        format: sql
        rows: |
          select '517' as line, '7' as brigade, 52.1 as lat, 21.1 as lon, timestamp('2026-01-14 23:30:00+00:00') as gps_time, '2001' as vehicle_number, 1 as vehicle_type, timestamp('2026-01-14 23:30:10+00:00') as ingested_at, date '2026-01-15' as gps_date
      - input: ref('stg_gtfs_trips')
        format: sql
        rows: |
          select 'trip-overnight' as trip_id, '517' as line, 'svc-previous' as service_id, 'Overnight' as trip_headsign, 0 as direction_id, '7' as brigade, 'shape-overnight' as shape_id, 'snapshot-valid' as gtfs_snapshot_id
          union all select 'trip-current', '517', 'svc-current', 'Current', 0, '7', 'shape-current', 'snapshot-valid'
      - input: ref('stg_gtfs_stop_times')
        format: sql
        rows: |
          select 'trip-overnight' as trip_id, 'stop-1' as stop_id, 1 as stop_sequence, 86400 as arrival_time_seconds, 86400 as departure_time_seconds, 'snapshot-valid' as gtfs_snapshot_id
          union all select 'trip-overnight', 'stop-2', 2, 90000, 90000, 'snapshot-valid'
          union all select 'trip-current', 'stop-3', 1, 600, 600, 'snapshot-valid'
          union all select 'trip-current', 'stop-4', 2, 3600, 3600, 'snapshot-valid'
      - input: ref('stg_gtfs_calendar_dates')
        format: sql
        rows: |
          select 'svc-previous' as service_id, date '2026-01-14' as service_date, 1 as exception_type, 'weekday' as day_type, 'snapshot-valid' as gtfs_snapshot_id
          union all select 'svc-current', date '2026-01-15', 1, 'weekday', 'snapshot-valid'
    expect:
      rows:
        - line: '517'
          brigade: '7'
          lat: 52.1
          lon: 21.1
          gps_time: '2026-01-14 23:30:00+00:00'
          vehicle_number: '2001'
          vehicle_type: 1
          ingested_at: '2026-01-14 23:30:10+00:00'
          gps_date: '2026-01-15'
          trip_id: 'trip-current'
          shape_id: 'shape-current'
          service_id: 'svc-current'
          direction_id: 0
          service_date: '2026-01-15'
          day_type: 'weekday'
          trip_start_seconds: 600
          trip_end_seconds: 3600
          gps_time_seconds: 1800
