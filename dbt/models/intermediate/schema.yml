version: 2

models:
  - name: int_gps_hourly_completeness
    description: Hourly processing coverage metadata for staged GPS pings. One Warsaw-local GPS date is rebuilt at a time and emits one row per expected vehicle type and real Warsaw-local hour. Coverage is estimated from distinct 10-second GPS timestamp buckets because each poll returns many vehicle rows, not one explicit poll snapshot row.
    columns:
      - name: gps_date
      - name: gps_hour
        description: Timestamp for the real hour boundary in Europe/Warsaw. Timestamp storage disambiguates DST fall-back hours.
      - name: vehicle_type
      - name: first_gps_time
        description: Earliest GPS timestamp observed in this vehicle/hour bucket. Null when no rows were observed.
      - name: last_gps_time
        description: Latest GPS timestamp observed in this vehicle/hour bucket. Null when no rows were observed.
      - name: row_count
      - name: vehicle_count
      - name: observed_10s_buckets
      - name: expected_10s_buckets
      - name: coverage_ratio
      - name: max_gap_seconds

  - name: int_ping_trip
    description: GPS pings matched to scheduled duty-chain trips. Processes one Warsaw-local GPS date at a time and can match previous-service-date overnight trips.
    columns:
      - name: line
        description: Public line identifier from the selected scheduled GTFS trip. Use observed_line for the GPS-reported line before settled matching.
      - name: brigade
        description: Normalized brigade/block short name used to match GPS pings to scheduled trips.
      - name: lat
        description: GPS latitude after staging coordinate guards.
      - name: lon
        description: GPS longitude after staging coordinate guards.
      - name: gps_time
        description: Timestamp reported by the vehicle position source.
      - name: vehicle_number
        description: Vehicle identifier reported by the GPS source. Together with gps_time this is the model grain within a processed GPS date.
      - name: vehicle_type
        description: "Vehicle type from the GPS source: 1 for bus, 2 for tram."
      - name: ingested_at
        description: Timestamp when the poller accepted the raw GPS row.
      - name: gps_date
        description: Warsaw-local processing date partition for the GPS ping.
      - name: trip_id
        description: Matched GTFS trip_id for the selected GTFS snapshot.
      - name: shape_id
        description: GTFS shape_id for the matched trip.
      - name: gtfs_snapshot_id
        description: Selected GTFS snapshot used for trip matching.
      - name: service_id
        description: Opaque GTFS service_id for the matched trip. Keep as lineage; do not use as a user-facing schedule class.
      - name: direction_id
        description: GTFS direction_id for the matched trip.
      - name: service_date
        description: GTFS service date for the matched trip. Can be the previous calendar date for overnight service.
      - name: day_type
        description: Calendar weekday/weekend class from GTFS staging. This is not the transit schedule pattern; marts should use dim_schedule_date.schedule_day_type or baked fact labels when that distinction matters.
      - name: trip_start_seconds
        description: Earliest scheduled stop time for the matched trip, in seconds since GTFS service-day midnight. Values can exceed 86400 for overnight service.
      - name: trip_end_seconds
        description: Latest scheduled stop time for the matched trip, in seconds since GTFS service-day midnight. Values can exceed 86400 for overnight service.
      - name: gps_time_seconds
        description: GPS timestamp expressed as seconds since the matched GTFS service-date midnight.
      - name: observed_line
        description: Public line reported by the GPS source before matching.
      - name: matching_method
        description: Matcher label. Current value is settled_duty_chain.
      - name: matched_duty_chain_id
        description: Duty-chain identifier selected for this ping.
      - name: matched_duty_chain_source
        description: Duty-chain identity source selected for this ping.
      - name: matched_duty_chain_source_id
        description: Raw duty-chain source identifier selected for this ping.
      - name: matched_duty_trip_order
        description: Scheduled trip order within the selected duty chain.
      - name: candidate_rank
        description: Candidate rank after scoring. Selected rows have rank 1.
      - name: candidate_count
        description: Duty-chain trip candidates inside the matching tolerance.
      - name: line_match_candidate_count
        description: Number of candidates whose scheduled line matched the GPS-reported line.
      - name: timing_penalty_seconds
        description: Seconds outside the scheduled trip window. Zero means the ping is inside the scheduled start/end window.
      - name: timing_score
        description: Score from 0 to 1 derived from timing_penalty_seconds.
      - name: duty_chain_continuity_score
        description: Relative full-day evidence for the selected vehicle and duty chain.
      - name: spatial_score
        description: Reserved for shape/stop spatial scoring.
      - name: progression_score
        description: Reserved for stop-sequence or shape-progress scoring.
      - name: matching_flags
        description: "Matcher caveats: early_origin_censored, late_tail_censored, delayed_same_line_tail, candidate_overlap, likely_previous_trip_tail, likely_vehicle_swap, uncertain_assignment."

  - name: int_stop_arrivals
    description: Realized passenger-service stop arrivals reconstructed from matched GPS ping segments and scheduled GTFS stop times. One Warsaw-local GPS date is processed at a time. A stop arrival is emitted when a consecutive GPS segment passes within the stop's adaptive radius and the scheduled arrival is within a +/-30 minute window around the segment. Non-passenger GTFS stop-time rows are excluded from observed arrivals. First and last passenger-stop candidates must preserve chronology with the adjacent selected passenger stop, then prefer schedule proximity before segment distance; when the adjacent stop is unobserved, selection retains distance-first behavior.
    columns:
      - name: gtfs_snapshot_id
        description: Selected GTFS snapshot used for stop-arrival reconstruction.
      - name: line
        description: Public line identifier for the matched trip.
      - name: brigade
        description: Normalized brigade/block short name for the matched trip.
      - name: vehicle_number
        description: Vehicle identifier from the GPS source.
      - name: vehicle_type
        description: "Vehicle type from the GPS source: 1 for bus, 2 for tram."
      - name: gps_date
        description: Warsaw-local processing date partition for the GPS pings used to reconstruct the arrival.
      - name: service_date
        description: GTFS service date for the matched trip. Can differ from gps_date for overnight service.
      - name: day_type
        description: Calendar weekday/weekend class from GTFS staging. This is not the transit schedule pattern; marts should use dim_schedule_date.schedule_day_type or baked fact labels when that distinction matters.
      - name: trip_id
        description: Matched GTFS trip_id.
      - name: shape_id
        description: GTFS shape_id for the matched trip.
      - name: service_id
        description: Opaque GTFS service_id for the matched trip. Kept as lineage.
      - name: direction_id
        description: GTFS direction_id for the matched trip.
      - name: stop_id
        description: GTFS stop_id for the scheduled stop arrival.
      - name: stop_name
        description: Stop name from the selected GTFS snapshot.
      - name: stop_sequence
        description: GTFS stop_sequence for the stop within the trip. Together with snapshot, service date, trip, and vehicle, this is the model grain.
      - name: pickup_type
        description: GTFS pickup_type for this trip-stop row.
      - name: drop_off_type
        description: GTFS drop_off_type for this trip-stop row.
      - name: stop_service_class
        description: Passenger-service class derived from pickup/drop-off rules. int_stop_arrivals only emits regular and request rows.
      - name: stop_execution_class
        description: Settled trip-relative execution class. int_stop_arrivals emits passenger rows only.
      - name: classification_confidence
        description: Confidence in the trip-relative stop classification.
      - name: classification_reason
        description: Stable primary reason code for the stop classification.
      - name: classification_evidence
        description: Sorted evidence codes supporting the stop classification.
      - name: are_passenger_boundaries_settled
        description: True for all emitted arrivals; unsettled trips are excluded before crossing selection.
      - name: scheduled_arrival_time
        description: Scheduled arrival timestamp reconstructed from service_date and GTFS arrival seconds.
      - name: scheduled_departure_time
        description: Scheduled departure timestamp reconstructed from service_date and GTFS departure seconds.
      - name: actual_arrival_time
        description: Estimated actual arrival timestamp from interpolation across the GPS segment that passed the stop.
      - name: arrival_delay_seconds
        description: Difference in seconds between actual_arrival_time and scheduled_arrival_time. Positive values are late.
      - name: detection_method
        description: Reconstruction method label. Current values are segment_within_75m and segment_within_250m.
      - name: stop_match_radius_m
        description: Adaptive stop matching radius used for this detection. Regular stops use 75m; request and terminal/near-terminal stops use 250m.
      - name: stop_distance_m
        description: Distance in meters from the GPS segment to the scheduled stop point.
      - name: prev_ping_distance_m
        description: Distance in meters from the segment start ping to the scheduled stop point.
      - name: next_ping_distance_m
        description: Distance in meters from the segment end ping to the scheduled stop point.
      - name: segment_start_time
        description: GPS timestamp at the start of the segment used for interpolation.
      - name: segment_end_time
        description: GPS timestamp at the end of the segment used for interpolation.
      - name: segment_duration_seconds
        description: Duration in seconds between segment_start_time and segment_end_time.

  - name: int_gtfs_trip_schedule
    description: Denormalized scheduled GTFS trip under the selected GTFS snapshot for each Warsaw-local GPS processing date. One row per processing_date, service_date, selected gtfs_snapshot_id, and trip_id.
    columns:
      - name: service_date
        description: GTFS service date for the scheduled trip. Can be the previous date for overnight trips operating on processing_date.
      - name: processing_date
        description: Warsaw-local GPS processing date whose raw pings can overlap this scheduled trip.
      - name: schedule_day_type
        description: GTFS-derived service pattern for this line and direction on service_date under the selected GTFS snapshot.
      - name: schedule_service_ids
        description: Comma-delimited active GTFS service_id values for this line and direction on service_date in the selected GTFS snapshot.
      - name: gtfs_snapshot_id
        description: Selected GTFS snapshot used for this rebuild.
      - name: line
        description: Public line identifier from GTFS route_id. This is the current working line key, not a permanent historical entity guarantee.
      - name: direction_id
        description: GTFS direction_id for the scheduled trip.
      - name: trip_id
        description: GTFS trip_id from the selected snapshot. Kept as lineage and not used as part of the stable schedule fingerprint.
      - name: service_id
        description: GTFS service_id for the scheduled trip in the selected snapshot. Kept as lineage and not used as part of the stable schedule fingerprint.
      - name: trip_headsign
        description: Trip headsign from the selected snapshot. This is a display label and is not part of the schedule-version fingerprint.
      - name: shape_id
        description: GTFS shape_id for the scheduled trip in the selected snapshot.
      - name: trip_start_seconds
        description: First scheduled arrival time for the trip, in seconds since GTFS service-day midnight. Values can exceed 86400 for overnight service.
      - name: trip_end_seconds
        description: Last scheduled arrival time for the trip, in seconds since GTFS service-day midnight. Values can exceed 86400 for overnight service.
      - name: stop_count
        description: Number of scheduled stops in the trip.
      - name: ordered_stop_ids
        description: Pipe-delimited stop_id sequence ordered by GTFS stop_sequence.
      - name: ordered_arrival_time_seconds
        description: Pipe-delimited scheduled arrival seconds ordered by GTFS stop_sequence.
      - name: trip_timetable_signature
        description: Stable ordered stop/time signature for one trip, built from stop_sequence, stop_id, and arrival_time_seconds only.

  - name: int_gtfs_processing_snapshot
    description: Governing GTFS snapshot selected for each Warsaw-local GPS processing date. A snapshot is eligible only when its calendar covers both the processing date and the prior service date; the latest eligible snapshot by publish timestamp wins.
    columns:
      - name: processing_date
        description: Warsaw-local GPS processing date.
        tests: [not_null, unique]
      - name: gtfs_snapshot_id
        description: Latest raw GTFS snapshot that covers processing_date and processing_date - 1.
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'raw_gtfs_snapshots')
                field: snapshot_id
      - name: snapshot_timestamp
        description: Raw GTFS snapshot publish timestamp used to rank eligible snapshots.
        tests: [not_null]

  - name: int_gtfs_trip_schedule_history
    description: Var-free scheduled GTFS trip spine for historical schedule-version lineage. Uses int_gtfs_processing_snapshot to choose the governing snapshot for each processing date and emits processing-date plus prior-service-date trips.
    columns:
      - name: service_date
        description: GTFS service date for the scheduled trip. Can be the previous date for overnight trips operating on processing_date.
      - name: processing_date
        description: Warsaw-local GPS processing date whose raw pings can overlap this scheduled trip.
      - name: schedule_day_type
        description: GTFS-derived service pattern for this line and direction on service_date under the governing snapshot.
      - name: schedule_service_ids
        description: Comma-delimited active GTFS service_id values for this line and direction on service_date in the governing snapshot.
      - name: gtfs_snapshot_id
        description: Governing GTFS snapshot for this processing_date.
      - name: line
        description: Public line identifier from GTFS route_id.
      - name: direction_id
        description: GTFS direction_id for the scheduled trip.
      - name: trip_id
        description: GTFS trip_id from the governing snapshot.
      - name: service_id
        description: GTFS service_id for the scheduled trip in the governing snapshot.
      - name: trip_timetable_signature
        description: Stable ordered stop/time signature for one trip, built from stop_sequence, stop_id, and arrival_time_seconds only.

  - name: int_gtfs_duty_chain
    description: Ordered GTFS duty-chain schedule spine. One row per service_date, processing_date, selected snapshot, duty_chain_id, and trip_order. Uses GTFS block_id as the preferred duty identity and falls back to line plus normalized brigade only when block_id is missing.
    columns:
      - name: service_date
        description: GTFS service date for the scheduled duty segment.
        tests:
          - not_null:
              config: &int_gtfs_duty_chain_processing_date_filter
                where: "processing_date = date('{{ var(\"processing_date\", \"1970-01-01\") }}')"
      - name: processing_date
        description: Warsaw-local GPS processing date whose raw pings can overlap this duty segment.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: schedule_day_type
        description: GTFS-derived service pattern for this line and direction on service_date.
      - name: schedule_service_ids
        description: Comma-delimited active GTFS service_id values for this line and direction on service_date.
      - name: gtfs_snapshot_id
        description: Selected GTFS snapshot used for this rebuild.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: duty_chain_id
        description: Stable hash of gtfs_snapshot_id, service_date, duty_chain_source, and duty_chain_source_id.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: duty_chain_source
        description: Identity source. block_id is preferred; line_brigade is used only when GTFS block_id is missing.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
          - accepted_values:
              arguments:
                values: ['block_id', 'line_brigade']
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: duty_chain_source_id
        description: Raw chain identity value before hashing. Usually GTFS block_id; fallback is line:brigade.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: trip_order
        description: Scheduled trip order within the duty chain.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: line
        description: Public line identifier for the duty segment.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: route_short_name
        description: Public GTFS route short name.
      - name: mode
        description: Route mode from GTFS routes.
      - name: block_id
        description: GTFS block_id, when provided.
      - name: block_short_name
        description: GTFS block_short_name before normalization.
      - name: brigade
        description: Normalized block_short_name used by GPS matching.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: trip_id
        description: GTFS trip_id for this duty segment.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: service_id
        description: GTFS service_id for this scheduled trip.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: direction_id
        description: GTFS direction_id for this scheduled trip.
      - name: shape_id
        description: GTFS shape_id for this scheduled trip.
      - name: trip_headsign
        description: Trip headsign from the governing snapshot.
      - name: trip_start_seconds
        description: First scheduled stop time in seconds since GTFS service-day midnight.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: trip_end_seconds
        description: Last scheduled stop time in seconds since GTFS service-day midnight.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: scheduled_start_time
        description: Scheduled start timestamp in UTC.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: scheduled_end_time
        description: Scheduled end timestamp in UTC.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: stop_count
        description: Number of scheduled stops in the trip.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: origin_stop_id
        description: First scheduled stop_id.
      - name: origin_stop_name
        description: First scheduled stop name.
      - name: destination_stop_id
        description: Last scheduled stop_id.
      - name: destination_stop_name
        description: Last scheduled stop name.
      - name: is_depot_pull_out
        description: True when the trip starts at a depot stop such as R-3 Zajezdnia Ostrobramska.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: is_depot_pull_in
        description: True when the trip ends at a depot stop such as R-3 Zajezdnia Ostrobramska.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: is_depot_segment
        description: True when either terminal is a depot stop.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: is_public_service_segment
        description: True when neither terminal is classified as a depot stop.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: first_stop_sequence
        description: Minimum GTFS stop_sequence for the trip.
      - name: last_stop_sequence
        description: Maximum GTFS stop_sequence for the trip.
      - name: scheduled_distance_meters
        description: Reserved for shape-derived scheduled distance. Null until the feed exposes shape distance or a cheap distance derivation is added.
      - name: previous_trip_id
        description: Previous trip_id in the same duty chain by scheduled time.
      - name: next_trip_id
        description: Next trip_id in the same duty chain by scheduled time.
      - name: layover_from_previous_seconds
        description: Seconds between previous trip end and this trip start. Negative values indicate overlap.
      - name: layover_to_next_seconds
        description: Seconds between this trip end and next trip start. Negative values indicate overlap.
      - name: line_changed_from_previous
        description: True when this segment's line differs from the previous segment in the duty chain.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: line_changes_to_next
        description: True when the next segment's line differs within the same duty chain.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: overlaps_previous_trip
        description: True when this segment starts before the previous segment ends.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: has_negative_duration
        description: True when trip_end_seconds is before trip_start_seconds.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: has_missing_stops
        description: True when the trip has fewer than two stops or missing terminal stop IDs.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter
      - name: is_malformed_duty_segment
        description: Combined diagnostic for overlap, negative duration, or missing-stop conditions.
        tests:
          - not_null:
              config: *int_gtfs_duty_chain_processing_date_filter

  - name: int_schedule_version
    description: Per-line timetable fingerprint history. Consecutive selected-snapshot processing dates with the same timetable fingerprint collapse into one schedule version for line, direction_id, and schedule_day_type.
    columns:
      - name: schedule_version_id
        description: Stable identifier for one consecutive timetable version period. Includes valid_from_date so a timetable that returns after a change becomes a new version period.
      - name: line
        description: Public line identifier used as the working line key for this version.
      - name: direction_id
        description: GTFS direction_id for this version.
      - name: schedule_day_type
        description: GTFS-derived service pattern for this version.
      - name: timetable_fingerprint
        description: "Hash of the line timetable: all trip stop/time signatures sorted by scheduled start, scheduled end, and signature. Excludes GTFS snapshot IDs, trip IDs, service IDs, and display labels."
      - name: valid_from_date
        description: First Warsaw-local GPS processing date observed with this timetable fingerprint for line, direction_id, and schedule_day_type.
      - name: valid_to_date
        description: Last Warsaw-local GPS processing date before the next observed timetable fingerprint change for line, direction_id, and schedule_day_type. Null means no later collected change is known.
      - name: first_gtfs_snapshot_id
        description: First selected GTFS snapshot observed in this version period.
      - name: last_gtfs_snapshot_id
        description: Last selected GTFS snapshot observed in this version period.
      - name: first_processing_date
        description: First Warsaw-local GPS processing date observed in this version period. Equal to valid_from_date.
      - name: last_processing_date
        description: Last Warsaw-local GPS processing date currently observed with this version's timetable fingerprint.
      - name: max_scheduled_trip_count
        description: Maximum scheduled trip count observed for this line, direction_id, and schedule_day_type inside the version period.

  - name: int_trip_summary
    description: Completed-trip reconstruction summary. One row per observed vehicle trip candidate in a GPS processing date, using detected stop arrivals as the realized-trip grain and matched pings for quality diagnostics.
    columns:
      - name: gtfs_snapshot_id
        description: Selected GTFS snapshot used for trip matching, stop reconstruction, labels, and schedule-version lineage.
      - name: gps_date
        description: Warsaw-local GPS processing date partition rebuilt by dag_daily_gps.
      - name: service_date
        description: GTFS service date for the trip. Can be the prior calendar date for overnight service.
      - name: trip_id
        description: Matched GTFS trip_id from the selected snapshot.
      - name: vehicle_number
        description: Vehicle identifier observed in the GPS source.
      - name: line
        description: Public line identifier from the matched trip.
      - name: route_short_name
        description: Public route short name from the selected GTFS snapshot.
      - name: mode
        description: Transit mode from the governing GTFS route. Live GPS currently covers bus and tram.
      - name: brigade
        description: Normalized brigade/block short name used for GPS-to-GTFS trip matching.
      - name: vehicle_type
        description: "Vehicle type from the GPS source: 1 for bus, 2 for tram."
      - name: direction_id
        description: GTFS direction_id for the matched trip.
      - name: service_id
        description: GTFS service_id for the matched trip in the governing snapshot.
      - name: trip_headsign
        description: Matched trip headsign from the governing snapshot. This is an archive-safe display label.
      - name: shape_id
        description: GTFS shape_id for the matched trip.
      - name: day_type
        description: Calendar weekday/weekend class carried from upstream matching. Use schedule_day_type for transit service-pattern analytics.
      - name: schedule_day_type
        description: GTFS-derived service pattern for this line and direction on the service date.
      - name: schedule_service_ids
        description: Comma-delimited active GTFS service_id values for this line and direction under the governing snapshot.
      - name: schedule_version_id
        description: Timetable-version identifier for since-schedule-change analytics.
      - name: origin_stop_id
        description: First scheduled stop_id for the matched trip in the governing snapshot.
      - name: origin_stop_name
        description: First scheduled stop name from the governing snapshot. This is an archive-safe display label.
      - name: destination_stop_id
        description: Last scheduled stop_id for the matched trip in the governing snapshot.
      - name: destination_stop_name
        description: Last scheduled stop name from the governing snapshot. This is an archive-safe display label.
      - name: scheduled_start_time
        description: Timestamp of the first scheduled stop arrival for the matched trip.
      - name: scheduled_end_time
        description: Timestamp of the last scheduled stop arrival for the matched trip.
      - name: actual_start_time
        description: Estimated arrival time at the first detected stop sequence for the realized trip. For partial trips this can be a non-terminal stop, so use is_first_stop_observed before treating start_delay_seconds as a strict terminal delay.
      - name: actual_end_time
        description: Estimated arrival time at the last detected stop sequence for the realized trip. For partial trips this can be a non-terminal stop, so use is_last_stop_observed before treating end_delay_seconds as a strict terminal delay.
      - name: start_delay_seconds
        description: Difference in seconds between actual_start_time and scheduled_start_time. Positive values are late.
      - name: end_delay_seconds
        description: Difference in seconds between actual_end_time and scheduled_end_time. Positive values are late.
      - name: stops_expected
        description: Scheduled stop count for the matched trip.
      - name: stops_detected
        description: Number of scheduled stops detected from GPS segment crossings.
      - name: detected_stop_ratio
        description: stops_detected divided by stops_expected.
      - name: first_detected_stop_sequence
        description: Lowest scheduled stop_sequence detected for this realized trip.
      - name: last_detected_stop_sequence
        description: Highest scheduled stop_sequence detected for this realized trip.
      - name: max_stop_sequence_gap
        description: Largest scheduled stop_sequence gap between consecutive detected stops.
      - name: max_ping_gap_seconds
        description: Largest observed time gap between consecutive matched GPS pings for this vehicle trip. A value of 0 can mean no consecutive matched ping pair was available.
      - name: max_speed_mps
        description: Largest implied straight-line speed between consecutive matched GPS pings, in meters per second. A value of 0 can mean no consecutive matched ping pair was available.
      - name: is_first_stop_observed
        description: True when the first detected stop is within 2 scheduled stop_sequence positions from the scheduled first stop. The tolerance is provisional.
      - name: is_last_stop_observed
        description: True when the last detected stop is within 2 scheduled stop_sequence positions from the scheduled last stop. The tolerance is provisional.
      - name: has_non_monotonic_stop_progression
        description: True when detected stops move backward in scheduled stop_sequence when ordered by actual arrival time.
      - name: has_impossible_speed_jump
        description: True when matched GPS pings imply a straight-line speed above the provisional impossible-speed threshold.
      - name: has_stale_stop_progression
        description: True when the last detected stop is still outside terminal tolerance but its timestamp is within 120 seconds of, or later than, the scheduled trip end. This flags weak trip-progress evidence, not high delay by itself.
      - name: trip_quality
        description: "Reconstruction quality class. Thresholds are provisional. broken: detected_stop_ratio < 0.30, max_ping_gap_seconds > 1800, non-monotonic stop progression, or max_speed_mps > 50. complete: detected_stop_ratio >= 0.80, first and last stops observed within 2 stop_sequence positions, max_stop_sequence_gap <= 4, and max_ping_gap_seconds <= 900. partial: all other plausible observed trips. High delay or large internal stop gaps are not broken by themselves when endpoint evidence is coherent."
      - name: quality_flags
        description: "Array of explainable quality flags. missing_first_stop: first detected stop is not within 2 stop_sequence positions from the first scheduled stop. missing_last_stop: last detected stop is not within 2 positions from the last scheduled stop. low_stop_coverage: detected_stop_ratio < 0.80. large_ping_gap: max_ping_gap_seconds > 900. non_monotonic_stop_progression: detected stops move backward by stop_sequence when ordered by actual time. impossible_speed_jump: max_speed_mps > 50. large_stop_sequence_gap: detected stops skip a large scheduled sequence span. extreme_delay: trusted start or end endpoint delay > 3600 seconds. stale_stop_progression: detected stops remain far from the terminal when the scheduled trip should be ending. likely_wrong_trip_assignment: detected_stop_ratio < 0.30 or non-monotonic progression."
      - name: service_observation_class
        description: "Observed service class, separate from trip_quality. Precedence is matching_failure, modified, regular, then truncated. regular means route endpoints were observed without modified-service evidence, even if reconstruction quality is partial. truncated means coherent shortened service missing the scheduled origin and/or destination. modified means plausible operational deviation such as a large internal gap or stale route progress. matching_failure means evidence is too weak or contradictory to treat as operated service."
      - name: service_observation_flags
        description: "Array of service-class explanation flags: short_start, short_end, large_internal_gap, stale_progress, bad_assignment_evidence."

