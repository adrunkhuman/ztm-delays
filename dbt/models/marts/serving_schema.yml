version: 2

models:
  - name: dim_serving_date
    description: Frontend date-navigation dimension for service dates available in the serving marts.
    columns:
      - name: service_date
        tests:
          - not_null
          - unique
      - name: service_date_key
        tests:
          - not_null

  - name: mart_mode_window_summary
    description: Mode-level delay summary at frontend display grain.
    columns:
      - name: mode
        tests:
          - not_null:
              config: &source_end_date_filter
                where: "source_end_date = date('{{ var(\"processing_date\", \"1970-01-01\") }}')"
          - accepted_values:
              arguments:
                values: ['bus', 'tram']
              config: *source_end_date_filter
      - name: window_type
        tests:
          - not_null:
              config: *source_end_date_filter
          - accepted_values:
              arguments: &window_type_values
                values: ['day', 'weekdays', 'weekend', 'month']
              config: *source_end_date_filter
      - name: window_key
        tests:
          - not_null:
              config: *source_end_date_filter
      - name: source_end_date
        tests:
          - not_null:
              config: *source_end_date_filter
      - name: arrival_count
        tests:
          - not_null:
              config: *source_end_date_filter

  - name: mart_line_window_summary
    description: Line-level delay summary at frontend display grain.
    columns:
      - name: line
        tests:
          - not_null:
              config: *source_end_date_filter
      - name: mode
        tests:
          - not_null:
              config: *source_end_date_filter
          - accepted_values:
              arguments: &mode_values
                values: ['bus', 'tram']
              config: *source_end_date_filter
      - name: universe_type
        tests:
          - not_null:
              config: *source_end_date_filter
          - accepted_values:
              arguments: &universe_values
                values: ['all_observed', 'zone1_public']
              config: *source_end_date_filter
      - name: window_type
        tests:
          - not_null:
              config: *source_end_date_filter
          - accepted_values:
              arguments: *window_type_values
              config: *source_end_date_filter
      - name: source_end_date
        tests:
          - not_null:
              config: *source_end_date_filter

  - name: mart_stop_group_window_summary
    description: Stop-group delay summary at frontend display grain.
    columns:
      - name: stop_group_id
        tests:
          - not_null:
              config: *source_end_date_filter
      - name: mode
        tests:
          - not_null:
              config: *source_end_date_filter
          - accepted_values:
              arguments: *mode_values
              config: *source_end_date_filter
      - name: universe_type
        tests:
          - not_null:
              config: *source_end_date_filter
          - accepted_values:
              arguments: *universe_values
              config: *source_end_date_filter
      - name: window_type
        tests:
          - not_null:
              config: *source_end_date_filter
          - accepted_values:
              arguments: *window_type_values
              config: *source_end_date_filter
      - name: source_end_date
        tests:
          - not_null:
              config: *source_end_date_filter

  - name: mart_stop_post_window_summary
    description: Stop-post delay summary at frontend display grain.
    columns:
      - name: stop_id
        tests:
          - not_null:
              config: *source_end_date_filter
      - name: stop_group_id
        tests:
          - not_null:
              config: *source_end_date_filter
      - name: mode
        tests:
          - not_null:
              config: *source_end_date_filter
          - accepted_values:
              arguments: *mode_values
              config: *source_end_date_filter
      - name: universe_type
        tests:
          - not_null:
              config: *source_end_date_filter
          - accepted_values:
              arguments: *universe_values
              config: *source_end_date_filter
      - name: window_type
        tests:
          - not_null:
              config: *source_end_date_filter
          - accepted_values:
              arguments: *window_type_values
              config: *source_end_date_filter
      - name: source_end_date
        tests:
          - not_null:
              config: *source_end_date_filter

  - name: mart_hour_window_summary
    description: Entity/hour median-delay summary for frontend hour bars.
    columns:
      - name: entity_type
        tests:
          - not_null:
              config: *source_end_date_filter
          - accepted_values:
              arguments: &entity_type_values
                values: ['mode', 'line', 'stop_group', 'stop_post']
              config: *source_end_date_filter
      - name: entity_id
        tests:
          - not_null:
              config: *source_end_date_filter
      - name: mode
        tests:
          - not_null:
              config: *source_end_date_filter
          - accepted_values:
              arguments: *mode_values
              config: *source_end_date_filter
      - name: window_type
        tests:
          - not_null:
              config: *source_end_date_filter
          - accepted_values:
              arguments: *window_type_values
              config: *source_end_date_filter
      - name: local_hour
        tests:
          - not_null:
              config: *source_end_date_filter

  - name: mart_entity_daily_summary
    description: Plain daily entity median-delay table for seven-day frontend bars.
    columns:
      - name: entity_type
        tests:
          - not_null:
              config: &service_date_filter
                where: "service_date = date('{{ var(\"processing_date\", \"1970-01-01\") }}')"
          - accepted_values:
              arguments: *entity_type_values
              config: *service_date_filter
      - name: entity_id
        tests:
          - not_null:
              config: *service_date_filter
      - name: mode
        tests:
          - not_null:
              config: *service_date_filter
          - accepted_values:
              arguments: *mode_values
              config: *service_date_filter
      - name: service_date
        tests:
          - not_null:
              config: *service_date_filter

  - name: mart_entity_rankings
    description: Precomputed eligible entity rankings for landing pages.
    columns:
      - name: entity_type
        tests:
          - not_null:
              config: *source_end_date_filter
          - accepted_values:
              arguments:
                values: ['line', 'stop_group', 'stop_post']
              config: *source_end_date_filter
      - name: entity_id
        tests:
          - not_null:
              config: *source_end_date_filter
      - name: metric
        tests:
          - not_null:
              config: *source_end_date_filter
          - accepted_values:
              arguments:
                values: ['median_delay_seconds', 'on_time_rate', 'arrival_count', 'delay_spread_seconds']
              config: *source_end_date_filter
      - name: rank
        tests:
          - not_null:
              config: *source_end_date_filter
      - name: n_entities
        tests:
          - not_null:
              config: *source_end_date_filter

  - name: int_serving_trip_execution
    description: Canonical snapshot-aware observed trip execution used by trip-level serving marts.
    columns:
      - name: gtfs_snapshot_id
        tests:
          - not_null:
              config: *service_date_filter
      - name: service_date
        tests:
          - not_null:
              config: *service_date_filter
      - name: trip_id
        tests:
          - not_null:
              config: *service_date_filter
      - name: vehicle_number
        tests:
          - not_null:
              config: *service_date_filter

  - name: int_serving_stop_arrival
    description: Stop arrivals restricted to the canonical snapshot selected for each serving trip execution.
    columns:
      - name: gtfs_snapshot_id
        tests:
          - not_null:
              config: *service_date_filter
      - name: service_date
        tests:
          - not_null:
              config: *service_date_filter
      - name: trip_id
        tests:
          - not_null:
              config: *service_date_filter
      - name: vehicle_number
        tests:
          - not_null:
              config: *service_date_filter

  - name: mart_trip_daily
    description: Trip display mart with warehouse-computed delay profiles, erratic scores, and ranks.
    columns:
      - name: gtfs_snapshot_id
        tests:
          - not_null:
              config: *service_date_filter
      - name: service_date
        tests:
          - not_null:
              config: *service_date_filter
      - name: trip_id
        tests:
          - not_null:
              config: *service_date_filter
      - name: vehicle_number
        tests:
          - not_null:
              config: *service_date_filter

  - name: rpt_schedule_day_mapping_evidence
    description: Evidence report for service_id token to schedule-day mapping.

  - name: rpt_ranking_universe_evidence
    description: Evidence report for ranking-universe and ranking-eligibility exclusions.
