        description: Adaptive stop matching radius used for the direct detection. Null when no direct crossing was detected.
      - name: stop_distance_m
        description: Distance in meters from the GPS segment to the scheduled stop point when observed.
      - name: prev_ping_distance_m
        description: Distance in meters from the segment start ping to the scheduled stop point when observed.
