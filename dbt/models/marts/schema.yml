    model: dim_schedule_date
    overrides:
      vars:
        gtfs_snapshot_id: 'snapshot-valid'
    given:
      - input: source('raw', 'raw_gtfs_snapshots')
        format: sql
        rows: |
          select 'snapshot-old' as snapshot_id, timestamp('2026-07-01 00:00:00+00:00') as snapshot_timestamp, 'old-hash' as file_hash, 'gs://bucket/old.zip' as gcs_path
          union all select 'snapshot-valid', timestamp('2026-07-07 00:00:00+00:00'), 'valid-hash', 'gs://bucket/valid.zip'
          union all select 'snapshot-same-day', timestamp('2026-07-08 00:00:00+00:00'), 'same-day-hash', 'gs://bucket/same.zip'
      - input: ref('stg_gtfs__calendar_dates')
        format: sql
        rows: |
          select '2026-07-01:PcS' as service_id, date '2026-07-08' as service_date, 1 as exception_type, 'weekday' as day_type, 'snapshot-old' as gtfs_snapshot_id
          union all select 'PcM', date '2026-07-08', 1, 'weekday', 'snapshot-old'
          union all select '2026-07-01:PcS', date '2026-07-08', 1, 'weekday', 'snapshot-valid'
          union all select 'PcM', date '2026-07-08', 1, 'weekday', 'snapshot-valid'
          union all select 'NdM', date '2026-07-08', 1, 'weekday', 'snapshot-same-day'
    expect:
      rows:
        - service_date: '2026-07-08'
          schedule_day_type: 'wednesday'
          schedule_day_types: 'wednesday, weekday'
          schedule_service_ids: '2026-07-01:PcS, PcM'
          gtfs_snapshot_id: 'snapshot-valid'

