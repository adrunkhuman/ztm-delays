    model: dim_schedule_date
    given:
      - input: source('raw', 'raw_gtfs_snapshots')
        format: sql
        rows: |
          select 'snapshot-old' as snapshot_id, timestamp('2026-07-01 00:00:00+00:00') as snapshot_timestamp, 'old-hash' as file_hash, 'gs://bucket/old.zip' as gcs_path
          union all select 'snapshot-valid', timestamp('2026-07-07 00:00:00+00:00'), 'valid-hash', 'gs://bucket/valid.zip'
