      - input: ref('stg_gtfs__calendar_dates')
        format: sql
        rows: |
          select '2026-07-01:PcS' as service_id, date '2026-07-08' as service_date, 1 as exception_type, 'weekday' as day_type, 'snapshot-old' as gtfs_snapshot_id
          union all select 'PcM', date '2026-07-08', 1, 'weekday', 'snapshot-old'
          union all select '2026-07-01:PcS', date '2026-07-08', 1, 'weekday', 'snapshot-valid'
          union all select 'PcM', date '2026-07-08', 1, 'weekday', 'snapshot-valid'
