      - name: last_passenger_stop_sequence
      - name: scheduled_arrival_time
        description: Scheduled arrival timestamp reconstructed from service_date and GTFS arrival seconds.
      - name: scheduled_departure_time
        description: Scheduled departure timestamp reconstructed from service_date and GTFS departure seconds.
      - name: actual_arrival_time
        description: Directly observed arrival timestamp when the GPS segment crossed the stop.
      - name: delay_seconds
        description: Difference in seconds between actual_arrival_time and scheduled_arrival_time. Null when no direct arrival was observed.
      - name: hour_bracket
        description: Warsaw-local hour floor of scheduled_arrival_time.
