version: 2

models:
  - name: dim_line
    description: Archive-safe slowly changing line dictionary. One row per public line attribute version, using validity dates derived from the GTFS snapshot governance rule. Public line remains the working key for now, not a permanent historical entity guarantee.
    columns:
      - name: line
        description: Public line identifier from GTFS route_id. This is the working line key; future historical identity can be rebuilt from schedule_version_id and snapshot lineage if public line labels diverge too much over time.
        tests: [not_null]
      - name: route_short_name
        description: Public-facing route short name from GTFS routes.txt.
        tests: [not_null]
      - name: route_long_name
        description: Public-facing route long name when available. Currently null because the raw GTFS route loader does not retain route_long_name.
      - name: mode
        description: Transit mode derived from GTFS route_type. Bus and tram have live GPS pings; metro and rail are schedule-only in this pipeline.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['bus', 'tram', 'metro', 'rail']
      - name: has_live_gps
        description: True when the mode is covered by the live GPS poller. Only bus and tram are currently polled.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: attribute_hash
        description: Hash of the line display attributes used to collapse consecutive snapshots into one SCD row.
        tests: [not_null]
      - name: valid_from_date
        description: First Warsaw-local service date for which this line attribute version is governed by the associated snapshot state.
        tests: [not_null]
      - name: valid_to_date
        description: Last Warsaw-local service date for this attribute version. Null means open-ended until a later loaded snapshot changes the attributes.
      - name: first_gtfs_snapshot_id
        description: First governing GTFS snapshot observed with this consecutive attribute state.
        tests: [not_null]
      - name: last_gtfs_snapshot_id
        description: Last governing GTFS snapshot observed with this consecutive attribute state.
        tests: [not_null]

  - name: dim_line_current
    description: Current-snapshot public transit line lookup. Present-day convenience surface only; do not join historical facts to this table for archive labels.
    columns:
      - name: line
        description: Public line identifier from GTFS route_id for the selected current snapshot.
        tests: [not_null, unique]
      - name: mode
        description: Transit mode derived from GTFS route_type.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['bus', 'tram', 'metro', 'rail']
      - name: route_short_name
        description: Public-facing route short name from GTFS routes.txt.
        tests: [not_null]
      - name: route_long_name
        description: Public-facing route long name when available. Currently null because the raw GTFS route loader does not retain route_long_name.
      - name: direction_0_headsigns
        description: Distinct trip headsigns observed for GTFS direction_id 0 in the selected snapshot, pipe-delimited for display/debugging.
      - name: direction_1_headsigns
        description: Distinct trip headsigns observed for GTFS direction_id 1 in the selected snapshot, pipe-delimited for display/debugging.
      - name: has_live_gps
        description: True when the mode is covered by the live GPS poller.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: gtfs_snapshot_id
        description: Selected GTFS snapshot used to build this current lookup row.
        tests: [not_null]

  - name: dim_stop_post
    description: Archive-safe slowly changing stop/location dictionary. One row per stop_id attribute version, using validity dates derived from the GTFS snapshot governance rule.
    columns:
      - name: stop_id
        description: Stop/location identifier from GTFS stops.txt. Most bus/tram passenger posts are six-digit values; other GTFS location types can use non-six-digit IDs.
        tests: [not_null]
      - name: stop_group_id
        description: Parent stop group identifier derived as LEFT(stop_id, 4).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stop_group')
                field: stop_group_id
      - name: stop_post_code
        description: Derived frontend display code for the concrete stop post within the group. Six-character numeric post IDs use the final two digits, colon-delimited IDs use the final segment, other IDs use the suffix after the four-character group, and IDs without such a suffix fall back to the full stop_id. Distinct from any raw upstream GTFS stop_code metadata.
        tests: [not_null]
      - name: stop_name
        description: Stop/location name from GTFS stops.txt for this validity range.
        tests: [not_null]
      - name: stop_code
        description: Raw GTFS stop_code metadata from stops.txt. Distinct from derived stop_post_code.
      - name: zone_id
        description: Raw GTFS fare-zone metadata from stops.txt.
      - name: effective_zone_id
        description: Simplified fare-zone bucket for consumers; exact raw 1+2 boundary stops are treated as zone 1 and all other values pass through unchanged.
      - name: stop_name_stem
        description: Warsaw feed stop-name stem metadata.
      - name: town_name
        description: Warsaw feed locality name. Current feed uses Warszawa for Warsaw-proper stops.
      - name: stop_lat
        description: Stop/location latitude from GTFS stops.txt after staging coordinate guards.
        tests: [not_null]
      - name: stop_lon
        description: Stop/location longitude from GTFS stops.txt after staging coordinate guards.
        tests: [not_null]
      - name: attribute_hash
        description: Hash of stop group, derived stop-post code, selected stop metadata, name, and coordinates used to collapse consecutive snapshots into one SCD row.
        tests: [not_null]
      - name: valid_from_date
        description: First Warsaw-local service date for which this stop/location attribute version is governed by the associated snapshot state.
        tests: [not_null]
      - name: valid_to_date
        description: Last Warsaw-local service date for this stop/location attribute version. Null means open-ended until a later loaded snapshot changes the attributes.
      - name: first_gtfs_snapshot_id
        description: First governing GTFS snapshot observed with this consecutive attribute state.
        tests: [not_null]
      - name: last_gtfs_snapshot_id
        description: Last governing GTFS snapshot observed with this consecutive attribute state.
        tests: [not_null]

  - name: dim_stop_post_current
    description: Current-snapshot physical stop/location lookup. Present-day convenience surface only; do not join historical facts to this table for archive labels.
    columns:
      - name: stop_id
        description: Stop/location identifier from GTFS stops.txt for the selected current snapshot.
        tests: [not_null, unique]
      - name: stop_group_id
        description: Parent stop group identifier derived as LEFT(stop_id, 4).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stop_group_current')
                field: stop_group_id
      - name: stop_post_code
        description: Derived frontend display code for the concrete stop post within the group. Six-character numeric post IDs use the final two digits, colon-delimited IDs use the final segment, other IDs use the suffix after the four-character group, and IDs without such a suffix fall back to the full stop_id. Distinct from any raw upstream GTFS stop_code metadata.
        tests: [not_null]
      - name: stop_name
        description: Stop/location name from GTFS stops.txt.
        tests: [not_null]
      - name: stop_code
        description: Raw GTFS stop_code metadata from stops.txt. Distinct from derived stop_post_code.
      - name: zone_id
        description: Raw GTFS fare-zone metadata from stops.txt.
      - name: effective_zone_id
        description: Simplified fare-zone bucket for consumers; exact raw 1+2 boundary stops are treated as zone 1 and all other values pass through unchanged.
      - name: stop_name_stem
        description: Warsaw feed stop-name stem metadata.
      - name: town_name
        description: Warsaw feed locality name. Current feed uses Warszawa for Warsaw-proper stops.
      - name: stop_lat
        description: Stop/location latitude from GTFS stops.txt after staging coordinate guards.
        tests: [not_null]
      - name: stop_lon
        description: Stop/location longitude from GTFS stops.txt after staging coordinate guards.
        tests: [not_null]
      - name: lines_served
        description: Comma-delimited public lines serving this stop/location record in the selected GTFS snapshot.
        tests: [not_null]
      - name: modes_served
        description: Comma-delimited transit modes serving this stop/location record in the selected GTFS snapshot.
        tests: [not_null]
      - name: directions_served
        description: Comma-delimited GTFS direction_id values serving this stop/location record in the selected GTFS snapshot.
        tests: [not_null]
      - name: gtfs_snapshot_id
        description: Selected GTFS snapshot used to build this current lookup row.
        tests: [not_null]

  - name: dim_stop_group
    description: Archive-safe slowly changing stop-group dictionary. One row per stop_group_id attribute version, using validity dates derived from the GTFS snapshot governance rule.
    columns:
      - name: stop_group_id
        description: User-facing stop group identifier derived as LEFT(stop_id, 4).
        tests: [not_null]
      - name: stop_group_name
        description: Deterministic display name for the group in this validity range, chosen as the most common stop/location name with alphabetical tie-break.
        tests: [not_null]
      - name: stop_group_names
        description: Pipe-delimited set of distinct stop/location names inside the group in this validity range.
        tests: [not_null]
      - name: zone_ids
        description: Pipe-delimited set of raw GTFS fare-zone values across stop posts in this group.
      - name: effective_zone_ids
        description: Pipe-delimited set of simplified fare-zone buckets across stop posts in this group.
      - name: stop_name_stems
        description: Pipe-delimited set of stop-name stems across stop posts in this group.
      - name: town_names
        description: Pipe-delimited set of locality names across stop posts in this group.
      - name: centroid_lat
        description: Arithmetic mean latitude across stop/location records in the group for this validity range.
        tests: [not_null]
      - name: centroid_lon
        description: Arithmetic mean longitude across stop/location records in the group for this validity range.
        tests: [not_null]
      - name: stop_post_count
        description: Number of stop/location records in the group for this validity range.
        tests: [not_null]
      - name: attribute_hash
        description: Hash of group display attributes and grouped stop metadata, including zone_ids, effective_zone_ids, stop_name_stems, and town_names, used to collapse consecutive snapshots into one SCD row.
        tests: [not_null]
      - name: valid_from_date
        description: First Warsaw-local service date for which this stop-group attribute version is governed by the associated snapshot state.
        tests: [not_null]
      - name: valid_to_date
        description: Last Warsaw-local service date for this stop-group attribute version. Null means open-ended until a later loaded snapshot changes the attributes.
      - name: first_gtfs_snapshot_id
        description: First governing GTFS snapshot observed with this consecutive attribute state.
        tests: [not_null]
      - name: last_gtfs_snapshot_id
        description: Last governing GTFS snapshot observed with this consecutive attribute state.
        tests: [not_null]

  - name: dim_stop_group_current
    description: Current-snapshot user-facing stop group lookup. Present-day convenience surface only; do not join historical facts to this table for archive labels.
    columns:
      - name: stop_group_id
        description: User-facing stop group identifier derived as LEFT(stop_id, 4).
        tests: [not_null, unique]
      - name: stop_group_name
        description: Deterministic display name for the current group.
        tests: [not_null]
      - name: stop_group_names
        description: Pipe-delimited set of distinct stop/location names inside the current group.
        tests: [not_null]
      - name: zone_ids
        description: Pipe-delimited set of raw GTFS fare-zone values across current stop posts in this group.
      - name: effective_zone_ids
        description: Pipe-delimited set of simplified fare-zone buckets across current stop posts in this group.
      - name: stop_name_stems
        description: Pipe-delimited set of stop-name stems across current stop posts in this group.
      - name: town_names
        description: Pipe-delimited set of locality names across current stop posts in this group.
      - name: centroid_lat
        description: Arithmetic mean latitude across current stop/location records in the group.
        tests: [not_null]
      - name: centroid_lon
        description: Arithmetic mean longitude across current stop/location records in the group.
        tests: [not_null]
      - name: stop_post_count
        description: Number of current stop/location records in the group.
        tests: [not_null]
      - name: lines_served
        description: Comma-delimited public lines serving any current stop/location record in the group.
        tests: [not_null]
      - name: modes_served
        description: Comma-delimited transit modes serving any current stop/location record in the group.
        tests: [not_null]
      - name: directions_served
        description: Comma-delimited GTFS direction_id values serving any current stop/location record in the group.
        tests: [not_null]
      - name: gtfs_snapshot_id
        description: Selected GTFS snapshot used to build this current lookup row.
        tests: [not_null]

  - name: dim_date
    description: Immutable calendar date dimension spanning the GTFS service-date range loaded into staging. Contains calendar attributes only; GTFS-derived service-pattern classification lives in dim_schedule_date.
    columns:
      - name: service_date
        description: Calendar date in Warsaw-local service-date semantics.
        tests: [not_null, unique]
      - name: day_type
        description: Calendar day class derived only from weekday/weekend, independent of the schedule pattern that ran.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['weekday', 'weekend']
      - name: is_holiday
        description: True when service_date is a Polish public holiday, including fixed-date holidays and Easter-based movable holidays.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: weekday_name
        description: English weekday name for service_date.
        tests: [not_null]
      - name: day_of_week
        description: BigQuery day-of-week number for service_date, where Sunday is 1 and Saturday is 7.
        tests: [not_null]
      - name: iso_week
        description: ISO week number for service_date.
        tests: [not_null]
      - name: month
        description: Calendar month number for service_date.
        tests: [not_null]
      - name: year
        description: Calendar year for service_date.
        tests: [not_null]

  - name: dim_schedule_date
    description: Schedule-date dimension for the selected GTFS snapshot. Nightly GPS rebuilds use the latest dimension-built snapshot available at rebuild time and publish both the processing date and prior service date, so late schedule corrections for yesterday are replaced by the next nightly run.
    columns:
      - name: service_date
        description: Warsaw-local service date whose schedule classification is derived from the selected GTFS snapshot.
        tests: [not_null, unique]
      - name: schedule_day_type
        description: Service pattern that actually ran according to GTFS service_id assignments in the selected snapshot.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday_holiday', 'weekday', 'mixed', 'unknown']
      - name: schedule_day_types
        description: Comma-delimited set of schedule classes extracted from all selected-snapshot GTFS service_id values for this service_date before collapsing to schedule_day_type. Unknown when the selected snapshot has no active service IDs for the date.
      - name: schedule_service_ids
        description: Comma-delimited raw GTFS service_id values active for this service_date in the selected snapshot. Empty when the selected snapshot has no active service IDs for the date.
      - name: gtfs_snapshot_id
        description: Selected GTFS snapshot used to build this schedule-date row.
        tests: [not_null]

  - name: dim_schedule_date_current
    description: Current-snapshot schedule-date lookup spanning the selected GTFS calendar_dates range. Present-day/future-schedule convenience surface only; historical facts should use their baked labels and dim_schedule_date lineage.
    columns:
      - name: service_date
        description: Service date in the selected current GTFS snapshot.
        tests: [not_null, unique]
      - name: day_type
        description: Calendar weekday/weekend class from service_date.
        tests: [not_null]
      - name: is_holiday
        description: Polish public holiday flag for service_date.
        tests: [not_null]
      - name: weekday_name
        description: English weekday name for service_date.
      - name: day_of_week
        description: BigQuery day-of-week number for service_date, where Sunday is 1 and Saturday is 7.
      - name: iso_week
        description: ISO week number for service_date.
      - name: month
        description: Calendar month number for service_date.
      - name: year
        description: Calendar year for service_date.
      - name: schedule_day_type
        description: Service pattern according to the selected current GTFS snapshot.
        tests: [not_null]
      - name: schedule_day_types
        description: Comma-delimited schedule classes from the selected snapshot before collapse.
      - name: schedule_service_ids
        description: Comma-delimited raw GTFS service_id values active for this service_date in the selected snapshot.
      - name: gtfs_snapshot_id
        description: Selected GTFS snapshot used to build this current schedule-date row.
        tests: [not_null]

  - name: dim_schedule_version
    description: Schedule version dimension. One row per consecutive unchanged timetable fingerprint for line, direction_id, and schedule_day_type, derived from selected GTFS snapshots observed in GPS processing windows. Versions are only known from collected GTFS snapshots onward because the mkuran feed is a rolling 31-day window. Nightly GPS rebuilds use the latest dimension-built snapshot and republish the prior service date to absorb late schedule corrections. Use this model for timetable baselines only; display labels come from baked fact columns.
    columns:
      - name: schedule_version_id
        description: Stable identifier for one consecutive timetable version period. Includes valid_from_date so a timetable that returns after a change becomes a new version period.
        tests: [not_null, unique]
      - name: line
        description: Public line identifier used as the working line key for this version. This is not a permanent historical entity guarantee.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_line')
                field: line
      - name: direction_id
        description: GTFS direction_id for this version.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: schedule_day_type
        description: GTFS-derived service pattern for this version.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday_holiday', 'weekday', 'mixed', 'unknown']
      - name: timetable_fingerprint
        description: "Hash of the line timetable: all trip stop/time signatures sorted by scheduled start, scheduled end, and signature. Excludes GTFS snapshot IDs, trip IDs, service IDs, and display labels."
        tests: [not_null]
      - name: valid_from_date
        description: First Warsaw-local GPS processing date observed with this timetable fingerprint for line, direction_id, and schedule_day_type.
        tests: [not_null]
      - name: valid_to_date
        description: Last Warsaw-local GPS processing date before the next observed timetable fingerprint change for line, direction_id, and schedule_day_type. Null means no later collected change is known.
      - name: first_gtfs_snapshot_id
        description: First selected GTFS snapshot observed in this version period.
        tests: [not_null]
      - name: last_gtfs_snapshot_id
        description: Last selected GTFS snapshot observed in this version period.
        tests: [not_null]
      - name: first_processing_date
        description: First Warsaw-local GPS processing date observed in this version period. Equal to valid_from_date.
        tests: [not_null]
      - name: last_processing_date
        description: Last Warsaw-local GPS processing date currently observed with this version's timetable fingerprint.
        tests: [not_null]
      - name: max_scheduled_trip_count
        description: Maximum scheduled trip count observed for this line, direction_id, and schedule_day_type inside the version period.
        tests: [not_null]

  - name: fct_trip
    description: Serving-layer completed-trip fact. One row per observed vehicle trip candidate, partitioned by service_date, with archive-safe labels baked from the selected GTFS snapshot and trip quality retained for strict/exploratory/debug filtering.
    columns:
      - name: gtfs_snapshot_id
        description: Selected GTFS snapshot used for matching, schedule lineage, and archive-safe labels.
      - name: gps_date
        description: Warsaw-local GPS processing date that produced this realized trip row.
      - name: service_date
        description: GTFS service date for the trip. This is the fact partition field.
      - name: trip_id
        description: Matched GTFS trip_id from the selected snapshot.
      - name: vehicle_number
        description: Vehicle identifier observed in the GPS source.
      - name: line
        description: Public line identifier from the matched trip.
      - name: route_short_name
        description: Public route short name from the selected GTFS snapshot.
      - name: mode
        description: Transit mode from the governing GTFS route.
      - name: brigade
        description: Normalized brigade/block short name used for trip matching.
      - name: vehicle_type
        description: "Vehicle type from the GPS source: 1 for bus, 2 for tram."
      - name: direction_id
        description: GTFS direction_id for the matched trip.
      - name: service_id
        description: GTFS service_id for the matched trip in the selected snapshot.
      - name: trip_headsign
        description: Matched trip headsign from the selected snapshot. This is an archive-safe display label.
      - name: shape_id
        description: GTFS shape_id for the matched trip.
      - name: day_type
        description: Calendar weekday/weekend class carried from upstream matching.
      - name: schedule_day_type
        description: GTFS-derived service pattern for this line and direction on the service date.
      - name: schedule_service_ids
        description: Comma-delimited active GTFS service_id values for this line and direction under the selected snapshot.
      - name: schedule_version_id
        description: Timetable-version identifier for since-schedule-change analytics.
      - name: origin_stop_id
        description: First scheduled stop_id for the matched trip in the selected snapshot.
      - name: origin_stop_name
        description: First scheduled stop name from the selected snapshot. This is an archive-safe display label.
      - name: destination_stop_id
        description: Last scheduled stop_id for the matched trip in the selected snapshot.
      - name: destination_stop_name
        description: Last scheduled stop name from the selected snapshot. This is an archive-safe display label.
      - name: scheduled_start_time
        description: Timestamp of the first scheduled stop arrival for the matched trip.
      - name: scheduled_end_time
        description: Timestamp of the last scheduled stop arrival for the matched trip.
      - name: actual_start_time
        description: Estimated arrival time at the first detected stop sequence for the realized trip. For partial trips this can be a non-terminal stop, so use is_first_stop_observed before treating start_delay_seconds as a strict terminal delay.
      - name: actual_end_time
        description: Estimated arrival time at the last detected stop sequence for the realized trip. For partial trips this can be a non-terminal stop, so use is_last_stop_observed before treating end_delay_seconds as a strict terminal delay.
      - name: start_delay_seconds
        description: Difference in seconds between actual_start_time and scheduled_start_time. Positive values are late.
      - name: end_delay_seconds
        description: Difference in seconds between actual_end_time and scheduled_end_time. Positive values are late.
      - name: stops_expected
        description: Scheduled stop count for the matched trip.
      - name: stops_detected
        description: Number of scheduled stops detected from GPS segment crossings.
      - name: detected_stop_ratio
        description: stops_detected divided by stops_expected.
      - name: first_detected_stop_sequence
        description: Lowest scheduled stop_sequence detected for this realized trip.
      - name: last_detected_stop_sequence
        description: Highest scheduled stop_sequence detected for this realized trip.
      - name: max_stop_sequence_gap
        description: Largest scheduled stop_sequence gap between consecutive detected stops.
      - name: max_ping_gap_seconds
        description: Largest observed time gap between consecutive matched GPS pings for this vehicle trip. A value of 0 can mean no consecutive matched ping pair was available.
      - name: max_speed_mps
        description: Largest implied straight-line speed between consecutive matched GPS pings, in meters per second. A value of 0 can mean no consecutive matched ping pair was available.
      - name: is_first_stop_observed
        description: True when the first detected stop is within 2 scheduled stop_sequence positions from the scheduled first stop. The tolerance is provisional.
      - name: is_last_stop_observed
        description: True when the last detected stop is within 2 scheduled stop_sequence positions from the scheduled last stop. The tolerance is provisional.
      - name: has_non_monotonic_stop_progression
        description: True when detected stops move backward in scheduled stop_sequence when ordered by actual arrival time.
      - name: has_impossible_speed_jump
        description: True when matched GPS pings imply a straight-line speed above the provisional impossible-speed threshold.
      - name: has_stale_stop_progression
        description: True when the last detected stop is still outside terminal tolerance but its timestamp is within 120 seconds of, or later than, the scheduled trip end. This flags weak trip-progress evidence, not high delay by itself.
      - name: trip_quality
        description: "Reconstruction quality class. Thresholds are provisional. broken: detected_stop_ratio < 0.30, max_ping_gap_seconds > 1800, non-monotonic stop progression, or max_speed_mps > 50. complete: detected_stop_ratio >= 0.80, first and last stops observed within 2 stop_sequence positions, max_stop_sequence_gap <= 4, and max_ping_gap_seconds <= 900. partial: all other plausible observed trips. High delay or large internal stop gaps are not broken by themselves when endpoint evidence is coherent."
      - name: quality_flags
        description: "Array of explainable quality flags for filtering and debug views. missing_first_stop: first detected stop is not within 2 stop_sequence positions from the first scheduled stop. missing_last_stop: last detected stop is not within 2 positions from the last scheduled stop. low_stop_coverage: detected_stop_ratio < 0.80. large_ping_gap: max_ping_gap_seconds > 900. non_monotonic_stop_progression: detected stops move backward by stop_sequence when ordered by actual time. impossible_speed_jump: max_speed_mps > 50. large_stop_sequence_gap: detected stops skip a large scheduled sequence span. extreme_delay: trusted start or end endpoint delay > 3600 seconds. stale_stop_progression: detected stops remain far from the terminal when the scheduled trip should be ending. likely_wrong_trip_assignment: detected_stop_ratio < 0.30 or non-monotonic progression."
      - name: service_observation_class
        description: "Observed service class, separate from trip_quality. Precedence is matching_failure, modified, regular, then truncated. regular means route endpoints were observed without modified-service evidence, even if reconstruction quality is partial. truncated means coherent shortened service missing the scheduled origin and/or destination. modified means plausible operational deviation such as a large internal gap or stale route progress. matching_failure means evidence is too weak or contradictory to treat as operated service."
      - name: service_observation_flags
        description: "Array of service-class explanation flags: short_start, short_end, large_internal_gap, stale_progress, bad_assignment_evidence."

  - name: fct_stop_arrival
    description: Serving-layer stop-arrival detail fact. One row per detected scheduled stop arrival for an observed vehicle trip, partitioned by service_date, with archive-safe trip and stop labels baked from the selected GTFS snapshot. Strict analytics should default to trip_quality = 'complete'; partial rows are retained for exploration. Trips with non-monotonic stop progression keep diagnostics in fct_trip and intermediate models, but their stop arrivals are withheld from this serving fact.
    columns:
      - name: gtfs_snapshot_id
        description: Selected GTFS snapshot used for matching, schedule lineage, and archive-safe labels.
      - name: gps_date
        description: Warsaw-local processing date inherited from fct_trip for the run that published this stop-arrival row.
      - name: source_gps_date
        description: Warsaw-local GPS partition containing the source stop-arrival reconstruction. It can be the day after service_date for overnight trips completed by after-midnight GPS.
      - name: service_date
        description: GTFS service date for the matched trip. This is the fact partition field.
      - name: trip_id
        description: Matched GTFS trip_id from the selected snapshot.
      - name: vehicle_number
        description: Vehicle identifier observed in the GPS source.
      - name: line
        description: Public line identifier from the matched trip.
      - name: route_short_name
        description: Public route short name from the selected GTFS snapshot.
      - name: mode
        description: Transit mode from the governing GTFS route.
      - name: brigade
        description: Normalized brigade/block short name used for trip matching.
      - name: vehicle_type
        description: "Vehicle type from the GPS source: 1 for bus, 2 for tram."
      - name: direction_id
        description: GTFS direction_id for the matched trip.
      - name: service_id
        description: GTFS service_id for the matched trip in the selected snapshot.
      - name: trip_headsign
        description: Matched trip headsign from the selected snapshot. This is an archive-safe display label.
      - name: shape_id
        description: GTFS shape_id for the matched trip.
      - name: day_type
        description: Immutable calendar weekday/weekend class for the service date.
      - name: is_holiday
        description: True when service_date is a Polish public holiday.
      - name: schedule_day_type
        description: GTFS-derived service pattern for this line and direction on the service date under the selected snapshot.
      - name: schedule_service_ids
        description: Comma-delimited active GTFS service_id values for this line and direction under the selected snapshot.
      - name: schedule_version_id
        description: Timetable-version identifier for since-schedule-change analytics.
      - name: trip_quality
        description: Reconstruction quality class inherited from fct_trip. Strict analytics should use complete rows by default; exploratory views may include partial rows; broken rows are retained for debugging only.
      - name: quality_flags
        description: Array of explainable trip-quality flags inherited from fct_trip for filtering and debug views.
      - name: service_observation_class
        description: Observed service class inherited from fct_trip.
      - name: service_observation_flags
        description: Service-observation explanation flags inherited from fct_trip.
      - name: stop_id
        description: Physical stop/location identifier from the governing GTFS snapshot.
      - name: stop_group_id
        description: User-facing stop group identifier derived as LEFT(stop_id, 4).
      - name: stop_post_code
        description: Derived frontend display code for the concrete stop post within the group, for example 01 from 519001 or E1 from 1003M:E1.
      - name: stop_name
        description: Stop/location name from the governing GTFS snapshot. This is an archive-safe display label.
      - name: stop_lat
        description: Stop/location latitude from the governing GTFS snapshot.
      - name: stop_lon
        description: Stop/location longitude from the governing GTFS snapshot.
      - name: stop_group_name
        description: Deterministic user-facing stop group name from the governing GTFS snapshot, chosen from the most common post name in the group with alphabetical tie-break.
      - name: stop_sequence
        description: GTFS stop_sequence for this stop within the matched trip.
      - name: pickup_type
        description: GTFS pickup_type for this trip-stop row.
      - name: drop_off_type
        description: GTFS drop_off_type for this trip-stop row.
      - name: stop_service_class
        description: Passenger-service class for this trip-stop row. Observed stop arrivals exclude not_in_passenger_service rows.
      - name: stop_execution_class
        description: Settled trip-relative execution class. Published arrivals are passenger rows only.
      - name: classification_confidence
      - name: classification_reason
      - name: classification_evidence
      - name: are_passenger_boundaries_settled
      - name: scheduled_arrival_time
        description: Scheduled arrival timestamp reconstructed from service_date and GTFS arrival seconds.
      - name: scheduled_departure_time
        description: Scheduled departure timestamp reconstructed from service_date and GTFS departure seconds.
      - name: actual_arrival_time
        description: Estimated actual arrival timestamp from interpolation across the GPS segment that passed the stop.
      - name: delay_seconds
        description: Difference in seconds between actual_arrival_time and scheduled_arrival_time. Positive values are late; negative values are early.
      - name: hour_bracket
        description: Warsaw-local hour floor of scheduled_arrival_time. This is the leaderboard and distribution time bucket; for example, scheduled arrivals from 08:00:00 through 08:59:59 share the 08:00 bracket.
      - name: detection_method
        description: Reconstruction method label. Current values are segment_within_75m and segment_within_250m.
      - name: stop_match_radius_m
        description: Adaptive stop matching radius used for this detection.
      - name: stop_distance_m
        description: Distance in meters from the GPS segment to the scheduled stop point.
      - name: prev_ping_distance_m
        description: Distance in meters from the segment start ping to the scheduled stop point.
      - name: next_ping_distance_m
        description: Distance in meters from the segment end ping to the scheduled stop point.
      - name: segment_start_time
        description: GPS timestamp at the start of the segment used for interpolation.
      - name: segment_end_time
        description: GPS timestamp at the end of the segment used for interpolation.
      - name: segment_duration_seconds
        description: Duration in seconds between segment_start_time and segment_end_time.

