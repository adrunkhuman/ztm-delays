version: 2

models:
  - name: dim_line
    description: Archive-safe slowly changing line dictionary. One row per public line attribute version, using validity dates derived from the GTFS snapshot governance rule. Public line remains the working key for now, not a permanent historical entity guarantee.
    columns:
      - name: line
        description: Public line identifier from GTFS route_id. This is the working line key; future historical identity can be rebuilt from schedule_version_id and snapshot lineage if public line labels diverge too much over time.
        tests: [not_null]
      - name: route_short_name
        description: Public-facing route short name from GTFS routes.txt.
        tests: [not_null]
      - name: route_long_name
        description: Public-facing route long name when available. Currently null because the raw GTFS route loader does not retain route_long_name.
      - name: mode
        description: Transit mode derived from GTFS route_type. Bus and tram have live GPS pings; metro and rail are schedule-only in this pipeline.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['bus', 'tram', 'metro', 'rail']
      - name: has_live_gps
        description: True when the mode is covered by the live GPS poller. Only bus and tram are currently polled.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: attribute_hash
        description: Hash of the line display attributes used to collapse consecutive snapshots into one SCD row.
        tests: [not_null]
      - name: valid_from_date
        description: First Warsaw-local service date for which this line attribute version is governed by the associated snapshot state.
        tests: [not_null]
      - name: valid_to_date
        description: Last Warsaw-local service date for this attribute version. Null means open-ended until a later loaded snapshot changes the attributes.
      - name: first_gtfs_snapshot_id
        description: First governing GTFS snapshot observed with this consecutive attribute state.
        tests: [not_null]
      - name: last_gtfs_snapshot_id
        description: Last governing GTFS snapshot observed with this consecutive attribute state.
        tests: [not_null]

  - name: dim_line_current
    description: Current-snapshot public transit line lookup. Present-day convenience surface only; do not join historical facts to this table for archive labels.
    columns:
      - name: line
        description: Public line identifier from GTFS route_id for the selected current snapshot.
        tests: [not_null, unique]
      - name: mode
        description: Transit mode derived from GTFS route_type.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['bus', 'tram', 'metro', 'rail']
      - name: route_short_name
        description: Public-facing route short name from GTFS routes.txt.
        tests: [not_null]
      - name: route_long_name
        description: Public-facing route long name when available. Currently null because the raw GTFS route loader does not retain route_long_name.
      - name: direction_0_headsigns
        description: Distinct trip headsigns observed for GTFS direction_id 0 in the selected snapshot, pipe-delimited for display/debugging.
      - name: direction_1_headsigns
        description: Distinct trip headsigns observed for GTFS direction_id 1 in the selected snapshot, pipe-delimited for display/debugging.
      - name: has_live_gps
        description: True when the mode is covered by the live GPS poller.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: gtfs_snapshot_id
        description: Selected GTFS snapshot used to build this current lookup row.
        tests: [not_null]

  - name: dim_stop_post
    description: Archive-safe slowly changing stop/location dictionary. One row per stop_id attribute version, using validity dates derived from the GTFS snapshot governance rule.
    columns:
      - name: stop_id
        description: Stop/location identifier from GTFS stops.txt. Most bus/tram passenger posts are six-digit values; other GTFS location types can use non-six-digit IDs.
        tests: [not_null]
      - name: stop_group_id
        description: Parent stop group identifier derived as LEFT(stop_id, 4).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stop_group')
                field: stop_group_id
      - name: stop_name
        description: Stop/location name from GTFS stops.txt for this validity range.
        tests: [not_null]
      - name: stop_lat
        description: Stop/location latitude from GTFS stops.txt after staging coordinate guards.
        tests: [not_null]
      - name: stop_lon
        description: Stop/location longitude from GTFS stops.txt after staging coordinate guards.
        tests: [not_null]
      - name: attribute_hash
        description: Hash of stop group, name, and coordinates used to collapse consecutive snapshots into one SCD row.
        tests: [not_null]
      - name: valid_from_date
        description: First Warsaw-local service date for which this stop/location attribute version is governed by the associated snapshot state.
        tests: [not_null]
      - name: valid_to_date
        description: Last Warsaw-local service date for this stop/location attribute version. Null means open-ended until a later loaded snapshot changes the attributes.
      - name: first_gtfs_snapshot_id
        description: First governing GTFS snapshot observed with this consecutive attribute state.
        tests: [not_null]
      - name: last_gtfs_snapshot_id
        description: Last governing GTFS snapshot observed with this consecutive attribute state.
        tests: [not_null]

  - name: dim_stop_post_current
    description: Current-snapshot physical stop/location lookup. Present-day convenience surface only; do not join historical facts to this table for archive labels.
    columns:
      - name: stop_id
        description: Stop/location identifier from GTFS stops.txt for the selected current snapshot.
        tests: [not_null, unique]
      - name: stop_group_id
        description: Parent stop group identifier derived as LEFT(stop_id, 4).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stop_group_current')
                field: stop_group_id
      - name: stop_name
        description: Stop/location name from GTFS stops.txt.
        tests: [not_null]
      - name: stop_lat
        description: Stop/location latitude from GTFS stops.txt after staging coordinate guards.
        tests: [not_null]
      - name: stop_lon
        description: Stop/location longitude from GTFS stops.txt after staging coordinate guards.
        tests: [not_null]
      - name: lines_served
        description: Comma-delimited public lines serving this stop/location record in the selected GTFS snapshot.
        tests: [not_null]
      - name: modes_served
        description: Comma-delimited transit modes serving this stop/location record in the selected GTFS snapshot.
        tests: [not_null]
      - name: directions_served
        description: Comma-delimited GTFS direction_id values serving this stop/location record in the selected GTFS snapshot.
        tests: [not_null]
      - name: gtfs_snapshot_id
        description: Selected GTFS snapshot used to build this current lookup row.
        tests: [not_null]

  - name: dim_stop_group
    description: Archive-safe slowly changing stop-group dictionary. One row per stop_group_id attribute version, using validity dates derived from the GTFS snapshot governance rule.
    columns:
      - name: stop_group_id
        description: User-facing stop group identifier derived as LEFT(stop_id, 4).
        tests: [not_null]
      - name: stop_group_name
        description: Deterministic display name for the group in this validity range, chosen as the most common stop/location name with alphabetical tie-break.
        tests: [not_null]
      - name: stop_group_names
        description: Pipe-delimited set of distinct stop/location names inside the group in this validity range.
        tests: [not_null]
      - name: centroid_lat
        description: Arithmetic mean latitude across stop/location records in the group for this validity range.
        tests: [not_null]
      - name: centroid_lon
        description: Arithmetic mean longitude across stop/location records in the group for this validity range.
        tests: [not_null]
      - name: stop_post_count
        description: Number of stop/location records in the group for this validity range.
        tests: [not_null]
      - name: attribute_hash
        description: Hash of group display attributes used to collapse consecutive snapshots into one SCD row.
        tests: [not_null]
      - name: valid_from_date
        description: First Warsaw-local service date for which this stop-group attribute version is governed by the associated snapshot state.
        tests: [not_null]
      - name: valid_to_date
        description: Last Warsaw-local service date for this stop-group attribute version. Null means open-ended until a later loaded snapshot changes the attributes.
      - name: first_gtfs_snapshot_id
        description: First governing GTFS snapshot observed with this consecutive attribute state.
        tests: [not_null]
      - name: last_gtfs_snapshot_id
        description: Last governing GTFS snapshot observed with this consecutive attribute state.
        tests: [not_null]

  - name: dim_stop_group_current
    description: Current-snapshot user-facing stop group lookup. Present-day convenience surface only; do not join historical facts to this table for archive labels.
    columns:
      - name: stop_group_id
        description: User-facing stop group identifier derived as LEFT(stop_id, 4).
        tests: [not_null, unique]
      - name: stop_group_name
        description: Deterministic display name for the current group.
        tests: [not_null]
      - name: stop_group_names
        description: Pipe-delimited set of distinct stop/location names inside the current group.
        tests: [not_null]
      - name: centroid_lat
        description: Arithmetic mean latitude across current stop/location records in the group.
        tests: [not_null]
      - name: centroid_lon
        description: Arithmetic mean longitude across current stop/location records in the group.
        tests: [not_null]
      - name: stop_post_count
        description: Number of current stop/location records in the group.
        tests: [not_null]
      - name: lines_served
        description: Comma-delimited public lines serving any current stop/location record in the group.
        tests: [not_null]
      - name: modes_served
        description: Comma-delimited transit modes serving any current stop/location record in the group.
        tests: [not_null]
      - name: directions_served
        description: Comma-delimited GTFS direction_id values serving any current stop/location record in the group.
        tests: [not_null]
      - name: gtfs_snapshot_id
        description: Selected GTFS snapshot used to build this current lookup row.
        tests: [not_null]

  - name: dim_date
    description: Immutable calendar date dimension spanning the GTFS service-date range loaded into staging. Contains calendar attributes only; GTFS-derived service-pattern classification lives in dim_schedule_date.
    columns:
      - name: service_date
        description: Calendar date in Warsaw-local service-date semantics.
        tests: [not_null, unique]
      - name: day_type
        description: Calendar day class derived only from weekday/weekend, independent of the schedule pattern that ran.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['weekday', 'weekend']
      - name: is_holiday
        description: True when service_date is a Polish public holiday, including fixed-date holidays and Easter-based movable holidays.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: weekday_name
        description: English weekday name for service_date.
        tests: [not_null]
      - name: day_of_week
        description: BigQuery day-of-week number for service_date, where Sunday is 1 and Saturday is 7.
        tests: [not_null]
      - name: iso_week
        description: ISO week number for service_date.
        tests: [not_null]
      - name: month
        description: Calendar month number for service_date.
        tests: [not_null]
      - name: year
        description: Calendar year for service_date.
        tests: [not_null]

  - name: dim_schedule_date
    description: Archive-safe schedule-date dimension. One row per governable service date, meaning dates with a loaded snapshot whose Warsaw-local snapshot date is strictly before service_date. If that governing snapshot has no active service IDs for the date, the row emits schedule_day_type unknown and empty lineage rather than falling back to an older snapshot.
    columns:
      - name: service_date
        description: Governable Warsaw-local service date whose schedule classification is derived from the governing GTFS snapshot.
        tests: [not_null, unique]
      - name: schedule_day_type
        description: Service pattern that actually ran according to GTFS service_id assignments in the governing snapshot.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday_holiday', 'weekday', 'mixed', 'unknown']
      - name: schedule_day_types
        description: Comma-delimited set of schedule classes extracted from all governing-snapshot GTFS service_id values for this service_date before collapsing to schedule_day_type. Unknown when the governing snapshot has no active service IDs for the date.
      - name: schedule_service_ids
        description: Comma-delimited raw GTFS service_id values active for this service_date in the governing snapshot. Empty when the governing snapshot has no active service IDs for the date.
      - name: gtfs_snapshot_id
        description: Governing GTFS snapshot selected as the latest snapshot whose Warsaw-local snapshot date is strictly before service_date.
        tests: [not_null]

  - name: dim_schedule_date_current
    description: Current-snapshot schedule-date lookup spanning the selected GTFS calendar_dates range. Present-day/future-schedule convenience surface only; historical facts should use their baked labels and dim_schedule_date lineage.
    columns:
      - name: service_date
        description: Service date in the selected current GTFS snapshot.
        tests: [not_null, unique]
      - name: day_type
        description: Calendar weekday/weekend class from service_date.
        tests: [not_null]
      - name: is_holiday
        description: Polish public holiday flag for service_date.
        tests: [not_null]
      - name: weekday_name
        description: English weekday name for service_date.
      - name: day_of_week
        description: BigQuery day-of-week number for service_date, where Sunday is 1 and Saturday is 7.
      - name: iso_week
        description: ISO week number for service_date.
      - name: month
        description: Calendar month number for service_date.
      - name: year
        description: Calendar year for service_date.
      - name: schedule_day_type
        description: Service pattern according to the selected current GTFS snapshot.
        tests: [not_null]
      - name: schedule_day_types
        description: Comma-delimited schedule classes from the selected snapshot before collapse.
      - name: schedule_service_ids
        description: Comma-delimited raw GTFS service_id values active for this service_date in the selected snapshot.
      - name: gtfs_snapshot_id
        description: Selected GTFS snapshot used to build this current schedule-date row.
        tests: [not_null]

  - name: dim_schedule_version
    description: Archive-safe schedule version dimension. One row per consecutive unchanged timetable fingerprint for line, direction_id, and schedule_day_type, derived from service-date governing GTFS snapshots observed in GPS processing windows. Versions are only known from collected GTFS snapshots onward because the mkuran feed is a rolling 31-day window. Same-day/intraday schedule changes are not represented until #27. Use this model for timetable baselines only; display labels come from governing-snapshot/archive-safe label columns.
    columns:
      - name: schedule_version_id
        description: Stable identifier for one consecutive timetable version period. Includes valid_from_date so a timetable that returns after a change becomes a new version period.
        tests: [not_null, unique]
      - name: line
        description: Public line identifier used as the working line key for this version. This is not a permanent historical entity guarantee.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_line')
                field: line
      - name: direction_id
        description: GTFS direction_id for this version.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: schedule_day_type
        description: GTFS-derived service pattern for this version.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday_holiday', 'weekday', 'mixed', 'unknown']
      - name: timetable_fingerprint
        description: "Hash of the line timetable: all trip stop/time signatures sorted by scheduled start, scheduled end, and signature. Excludes GTFS snapshot IDs, trip IDs, service IDs, and display labels."
        tests: [not_null]
      - name: valid_from_date
        description: First Warsaw-local GPS processing date observed with this timetable fingerprint for line, direction_id, and schedule_day_type.
        tests: [not_null]
      - name: valid_to_date
        description: Last Warsaw-local GPS processing date before the next observed timetable fingerprint change for line, direction_id, and schedule_day_type. Null means no later collected change is known.
      - name: first_gtfs_snapshot_id
        description: First governing GTFS snapshot observed in this version period.
        tests: [not_null]
      - name: last_gtfs_snapshot_id
        description: Last governing GTFS snapshot observed in this version period.
        tests: [not_null]
      - name: first_processing_date
        description: First Warsaw-local GPS processing date observed in this version period. Equal to valid_from_date.
        tests: [not_null]
      - name: last_processing_date
        description: Last Warsaw-local GPS processing date currently observed with this version's timetable fingerprint.
        tests: [not_null]
      - name: max_scheduled_trip_count
        description: Maximum scheduled trip count observed for this line, direction_id, and schedule_day_type inside the version period.
        tests: [not_null]

  - name: fct_trip
    description: Serving-layer completed-trip fact. One row per observed vehicle trip candidate, partitioned by service_date, with archive-safe labels baked from the governing GTFS snapshot and trip quality retained for strict/exploratory/debug filtering.
    columns:
      - name: gtfs_snapshot_id
        description: Governing GTFS snapshot used for matching, schedule lineage, and archive-safe labels.
      - name: gps_date
        description: Warsaw-local GPS processing date that produced this realized trip row.
      - name: service_date
        description: GTFS service date for the trip. This is the fact partition field.
      - name: trip_id
        description: Matched GTFS trip_id from the governing snapshot.
      - name: vehicle_number
        description: Vehicle identifier observed in the GPS source.
      - name: line
        description: Public line identifier from the matched trip.
      - name: route_short_name
        description: Public route short name from the governing GTFS snapshot.
      - name: mode
        description: Transit mode from the governing GTFS route.
      - name: brigade
        description: Normalized brigade/block short name used for trip matching.
      - name: vehicle_type
        description: "Vehicle type from the GPS source: 1 for bus, 2 for tram."
      - name: direction_id
        description: GTFS direction_id for the matched trip.
      - name: service_id
        description: GTFS service_id for the matched trip in the governing snapshot.
      - name: trip_headsign
        description: Matched trip headsign from the governing snapshot. This is an archive-safe display label.
      - name: shape_id
        description: GTFS shape_id for the matched trip.
      - name: day_type
        description: Calendar weekday/weekend class carried from upstream matching.
      - name: schedule_day_type
        description: GTFS-derived service pattern for this line and direction on the service date.
      - name: schedule_service_ids
        description: Comma-delimited active GTFS service_id values for this line and direction under the governing snapshot.
      - name: schedule_version_id
        description: Timetable-version identifier for since-schedule-change analytics.
      - name: origin_stop_id
        description: First scheduled stop_id for the matched trip in the governing snapshot.
      - name: origin_stop_name
        description: First scheduled stop name from the governing snapshot. This is an archive-safe display label.
      - name: destination_stop_id
        description: Last scheduled stop_id for the matched trip in the governing snapshot.
      - name: destination_stop_name
        description: Last scheduled stop name from the governing snapshot. This is an archive-safe display label.
      - name: scheduled_start_time
        description: Timestamp of the first scheduled stop arrival for the matched trip.
      - name: scheduled_end_time
        description: Timestamp of the last scheduled stop arrival for the matched trip.
      - name: actual_start_time
        description: Estimated arrival time at the first detected stop sequence for the realized trip. For partial trips this can be a non-terminal stop, so use is_first_stop_observed before treating start_delay_seconds as a strict terminal delay.
      - name: actual_end_time
        description: Estimated arrival time at the last detected stop sequence for the realized trip. For partial trips this can be a non-terminal stop, so use is_last_stop_observed before treating end_delay_seconds as a strict terminal delay.
      - name: start_delay_seconds
        description: Difference in seconds between actual_start_time and scheduled_start_time. Positive values are late.
      - name: end_delay_seconds
        description: Difference in seconds between actual_end_time and scheduled_end_time. Positive values are late.
      - name: stops_expected
        description: Scheduled stop count for the matched trip.
      - name: stops_detected
        description: Number of scheduled stops detected from GPS segment crossings.
      - name: detected_stop_ratio
        description: stops_detected divided by stops_expected.
      - name: first_detected_stop_sequence
        description: Lowest scheduled stop_sequence detected for this realized trip.
      - name: last_detected_stop_sequence
        description: Highest scheduled stop_sequence detected for this realized trip.
      - name: max_stop_sequence_gap
        description: Largest scheduled stop_sequence gap between consecutive detected stops.
      - name: max_ping_gap_seconds
        description: Largest observed time gap between consecutive matched GPS pings for this vehicle trip. A value of 0 can mean no consecutive matched ping pair was available.
      - name: max_speed_mps
        description: Largest implied straight-line speed between consecutive matched GPS pings, in meters per second. A value of 0 can mean no consecutive matched ping pair was available.
      - name: is_first_stop_observed
        description: True when the first detected stop is within 2 scheduled stop_sequence positions from the scheduled first stop. The tolerance is provisional.
      - name: is_last_stop_observed
        description: True when the last detected stop is within 2 scheduled stop_sequence positions from the scheduled last stop. The tolerance is provisional.
      - name: has_non_monotonic_stop_progression
        description: True when detected stops move backward in scheduled stop_sequence when ordered by actual arrival time.
      - name: has_impossible_speed_jump
        description: True when matched GPS pings imply a straight-line speed above the provisional impossible-speed threshold.
      - name: trip_quality
        description: "Reconstruction quality class. Thresholds are provisional. broken: detected_stop_ratio < 0.30, max_stop_sequence_gap > 4, max_ping_gap_seconds > 1800, non-monotonic stop progression, max_speed_mps > 50, or terminal delay beyond 3600 seconds. complete: detected_stop_ratio >= 0.80, first and last stops observed within 2 stop_sequence positions, and max_ping_gap_seconds <= 900. partial: all other plausible observed trips."
      - name: quality_flags
        description: "Array of explainable quality flags for filtering and debug views. missing_first_stop: first detected stop is not within 2 stop_sequence positions from the first scheduled stop. missing_last_stop: last detected stop is not within 2 positions from the last scheduled stop. low_stop_coverage: detected_stop_ratio < 0.80. large_ping_gap: max_ping_gap_seconds > 900. non_monotonic_stop_progression: detected stops move backward by stop_sequence when ordered by actual time. impossible_speed_jump: max_speed_mps > 50. extreme_delay: absolute start or end delay > 3600 seconds. likely_wrong_trip_assignment: detected_stop_ratio < 0.30, max_stop_sequence_gap > 4, or non-monotonic progression."

  - name: fct_stop_arrival
    description: Serving-layer stop-arrival detail fact. One row per detected scheduled stop arrival for an observed vehicle trip, partitioned by service_date, with archive-safe trip and stop labels baked from the governing GTFS snapshot. Strict analytics should default to trip_quality = 'complete'; partial rows are retained for exploration and broken rows for debugging.
    columns:
      - name: gtfs_snapshot_id
        description: Governing GTFS snapshot used for matching, schedule lineage, and archive-safe labels.
      - name: gps_date
        description: Warsaw-local processing date inherited from fct_trip for the run that published this stop-arrival row.
      - name: source_gps_date
        description: Warsaw-local GPS partition containing the source stop-arrival reconstruction. It can be the day after service_date for overnight trips completed by after-midnight GPS.
      - name: service_date
        description: GTFS service date for the matched trip. This is the fact partition field.
      - name: trip_id
        description: Matched GTFS trip_id from the governing snapshot.
      - name: vehicle_number
        description: Vehicle identifier observed in the GPS source.
      - name: line
        description: Public line identifier from the matched trip.
      - name: route_short_name
        description: Public route short name from the governing GTFS snapshot.
      - name: mode
        description: Transit mode from the governing GTFS route.
      - name: brigade
        description: Normalized brigade/block short name used for trip matching.
      - name: vehicle_type
        description: "Vehicle type from the GPS source: 1 for bus, 2 for tram."
      - name: direction_id
        description: GTFS direction_id for the matched trip.
      - name: service_id
        description: GTFS service_id for the matched trip in the governing snapshot.
      - name: trip_headsign
        description: Matched trip headsign from the governing snapshot. This is an archive-safe display label.
      - name: shape_id
        description: GTFS shape_id for the matched trip.
      - name: day_type
        description: Immutable calendar weekday/weekend class for the service date.
      - name: is_holiday
        description: True when service_date is a Polish public holiday.
      - name: schedule_day_type
        description: GTFS-derived service pattern for this line and direction on the service date under the governing snapshot.
      - name: schedule_service_ids
        description: Comma-delimited active GTFS service_id values for this line and direction under the governing snapshot.
      - name: schedule_version_id
        description: Timetable-version identifier for since-schedule-change analytics.
      - name: trip_quality
        description: Reconstruction quality class inherited from fct_trip. Strict analytics should use complete rows by default; exploratory views may include partial rows; broken rows are retained for debugging only.
      - name: quality_flags
        description: Array of explainable trip-quality flags inherited from fct_trip for filtering and debug views.
      - name: stop_id
        description: Physical stop/location identifier from the governing GTFS snapshot.
      - name: stop_group_id
        description: User-facing stop group identifier derived as LEFT(stop_id, 4).
      - name: stop_name
        description: Stop/location name from the governing GTFS snapshot. This is an archive-safe display label.
      - name: stop_lat
        description: Stop/location latitude from the governing GTFS snapshot.
      - name: stop_lon
        description: Stop/location longitude from the governing GTFS snapshot.
      - name: stop_group_name
        description: Deterministic user-facing stop group name from the governing GTFS snapshot, chosen from the most common post name in the group with alphabetical tie-break.
      - name: stop_sequence
        description: GTFS stop_sequence for this stop within the matched trip.
      - name: scheduled_arrival_time
        description: Scheduled arrival timestamp reconstructed from service_date and GTFS arrival seconds.
      - name: scheduled_departure_time
        description: Scheduled departure timestamp reconstructed from service_date and GTFS departure seconds.
      - name: actual_arrival_time
        description: Estimated actual arrival timestamp from interpolation across the GPS segment that passed the stop.
      - name: delay_seconds
        description: Difference in seconds between actual_arrival_time and scheduled_arrival_time. Positive values are late; negative values are early.
      - name: hour_bracket
        description: Warsaw-local hour floor of scheduled_arrival_time. This is the leaderboard and distribution time bucket; for example, scheduled arrivals from 08:00:00 through 08:59:59 share the 08:00 bracket.
      - name: detection_method
        description: Reconstruction method label. Current value is segment_within_50m.
      - name: stop_distance_m
        description: Distance in meters from the GPS segment to the scheduled stop point.
      - name: prev_ping_distance_m
        description: Distance in meters from the segment start ping to the scheduled stop point.
      - name: next_ping_distance_m
        description: Distance in meters from the segment end ping to the scheduled stop point.
      - name: segment_start_time
        description: GPS timestamp at the start of the segment used for interpolation.
      - name: segment_end_time
        description: GPS timestamp at the end of the segment used for interpolation.
      - name: segment_duration_seconds
        description: Duration in seconds between segment_start_time and segment_end_time.

  - name: mart_day_completeness
    description: Daily GPS ingestion completeness by Warsaw-local GPS date and mode. Normal builds replace the inclusive aggregation_start_date-through-processing_date GPS-date partitions. This is raw-ingestion coverage metadata, not schedule-aware service coverage; complete and partial trip facts remain usable even when a day is incomplete.
    columns:
      - name: gps_date
        description: Warsaw-local GPS processing date summarized by this row.
      - name: vehicle_type
        description: "Vehicle type from the GPS source: 1 for bus, 2 for tram."
      - name: mode
        description: Transit mode mapped from vehicle_type.
      - name: expected_hours
        description: Number of real Warsaw-local hourly GPS buckets expected for this date and mode.
      - name: present_hours
        description: Number of expected hourly buckets with at least one staged GPS row.
      - name: missing_hours
        description: Array of Warsaw-local hour-of-day integers with no staged GPS rows for this date and mode. DST fall-back days can repeat an hour value.
      - name: first_observed_time
        description: Earliest GPS timestamp observed for this date and mode. Null when no rows were observed.
      - name: last_observed_time
        description: Latest GPS timestamp observed for this date and mode. Null when no rows were observed.
      - name: completeness_ratio
        description: present_hours divided by expected_hours.
      - name: is_complete_day
        description: True when every expected hourly bucket has at least one staged GPS row.
      - name: gps_row_count
        description: Total staged GPS row count for this date and mode.
      - name: max_vehicle_count
        description: Maximum distinct vehicle count observed in any hourly bucket for this date and mode.
      - name: mean_hourly_coverage_ratio
        description: Average hourly 10-second bucket coverage ratio after zero-filling missing expected hours.
      - name: min_hourly_coverage_ratio
        description: Minimum hourly 10-second bucket coverage ratio after zero-filling missing expected hours.
      - name: max_gap_seconds
        description: Largest gap reported by present hourly buckets. Missing hours are represented through missing_hours, not as 3600-second gaps.

  - name: agg_service_coverage
    description: Schedule-aware hourly service coverage by line, direction, headsign, and scheduled-start date for live-GPS modes only. Normal builds replace the inclusive aggregation_start_date-through-processing_date scheduled-start-date partitions. Expected service comes from the governing GTFS bus/tram schedule; observed service counts distinct complete/partial scheduled trip_id values from int_trip_summary after best-quality dedupe and excludes broken trips. Rows exist only for scheduled bus/tram service; absence of a row is not a zero-coverage row.
    columns:
      - name: service_date
        description: GTFS service date assigned to the scheduled trips. Overnight service can have service_hour on the next calendar date.
      - name: scheduled_start_date
        description: Warsaw-local date of the scheduled trip start hour. This is the rebuild window key and table partition field.
      - name: gtfs_snapshot_id
        description: Governing GTFS snapshot used for expected service and archive-safe route labels.
      - name: line
        description: Public line identifier from the governing GTFS schedule.
      - name: route_short_name
        description: Public route short name from the governing GTFS snapshot.
      - name: mode
        description: Transit mode from the governing GTFS route.
      - name: direction_id
        description: GTFS direction_id for the scheduled trips.
      - name: trip_headsign
        description: Matched GTFS trip headsign for this line and direction under the governing snapshot.
      - name: schedule_day_type
        description: GTFS-derived service pattern from int_gtfs_trip_schedule under the governing snapshot.
      - name: schedule_service_ids
        description: Comma-delimited active GTFS service_id values for this line and direction under the governing snapshot.
      - name: schedule_version_id
        description: Timetable-version identifier for this line, direction_id, and schedule_day_type.
      - name: service_hour
        description: Warsaw-local scheduled-start hour bucket for expected and observed trips.
      - name: service_hour_end
        description: End timestamp of the scheduled service_hour bucket.
      - name: expected_trip_count
        description: Number of scheduled trips whose scheduled start time falls in service_hour.
      - name: observed_trip_count
        description: Number of distinct scheduled trip_id values observed as complete or partial in int_trip_summary whose scheduled start time falls in service_hour.
      - name: complete_trip_count
        description: Number of distinct observed trip_id values whose best available quality is complete in the service hour.
      - name: partial_trip_count
        description: Number of distinct observed trip_id values whose best available quality is partial in the service hour.
      - name: expected_service_minutes
        description: Sum of scheduled trip durations in minutes for trips starting in service_hour.
      - name: observed_service_minutes
        description: Sum of observed complete/partial trip durations in minutes from actual_start_time to actual_end_time after best-quality dedupe. Negative durations are treated as 0 minutes.
      - name: service_coverage_ratio
        description: observed_trip_count divided by expected_trip_count.
      - name: is_settled_hour
        description: True when service_hour_end is more than 90 minutes before current_timestamp, allowing delayed trips to appear before coverage is judged.

  - name: mart_pipeline_status
    description: Daily operational-health status by Warsaw-local status date and mode. Normal builds replace the inclusive aggregation_start_date-through-processing_date service-date partitions. The service_date field is aligned to the GPS processing date and scheduled-start date so ingestion, matching, trip quality, arrivals, and service coverage use one operational-day grain. Near-real-time poller liveness comes from the private poller heartbeat, not this historical mart.
    columns:
      - name: service_date
        description: Warsaw-local operational status date. This aligns raw GPS processing date with scheduled-start date for coverage metrics; it is not necessarily the GTFS service_date for overnight trips.
      - name: vehicle_type
        description: "Vehicle type from the GPS source: 1 for bus, 2 for tram."
      - name: mode
        description: Transit mode summarized by this row.
      - name: expected_hours
        description: Number of real Warsaw-local hourly GPS buckets expected for this date and mode.
      - name: present_hours
        description: Number of expected hourly buckets with at least one staged GPS row.
      - name: missing_hours
        description: Array of Warsaw-local hour-of-day integers with no staged GPS rows for this date and mode.
      - name: first_observed_time
        description: Earliest GPS timestamp observed for this date and mode. Null when no rows were observed.
      - name: last_observed_time
        description: Latest GPS timestamp observed for this date and mode. Null when no rows were observed.
      - name: completeness_ratio
        description: present_hours divided by expected_hours.
      - name: is_complete_day
        description: True when every expected hourly bucket has at least one staged GPS row.
      - name: gps_row_count
        description: Total staged GPS row count from mart_day_completeness for this date and mode.
      - name: max_vehicle_count
        description: Maximum distinct vehicle count observed in any hourly bucket for this date and mode.
      - name: mean_hourly_coverage_ratio
        description: Average hourly 10-second bucket coverage ratio after zero-filling missing expected hours.
      - name: min_hourly_coverage_ratio
        description: Minimum hourly 10-second bucket coverage ratio after zero-filling missing expected hours.
      - name: max_gap_seconds
        description: Largest gap reported by present hourly buckets. Missing hours are represented through missing_hours, not as 3600-second gaps.
      - name: pings_total
        description: Number of staged, deduplicated GPS pings for this date and mode.
      - name: pings_matched
        description: Number of GPS pings matched to a scheduled trip candidate in int_ping_trip.
      - name: match_rate
        description: pings_matched divided by pings_total. Zero when no staged pings exist.
      - name: trips_observed
        description: int_trip_summary candidate rows for this status date and mode across all trip_quality values.
      - name: trips_complete
        description: int_trip_summary candidate rows with trip_quality = complete.
      - name: trips_partial
        description: int_trip_summary candidate rows with trip_quality = partial.
      - name: trips_broken
        description: int_trip_summary candidate rows with trip_quality = broken.
      - name: broken_rate
        description: trips_broken divided by trips_observed. Zero when no trips were observed.
      - name: expected_trips
        description: Settled scheduled trips from agg_service_coverage for this scheduled-start date and mode.
      - name: observed_trips
        description: Settled complete/partial observed trips from agg_service_coverage for this scheduled-start date and mode.
      - name: service_coverage_ratio
        description: observed_trips divided by expected_trips for settled service hours. Null when no settled scheduled service exists.
      - name: expected_service_minutes
        description: Settled expected service minutes from agg_service_coverage.
      - name: observed_service_minutes
        description: Settled observed service minutes from agg_service_coverage.
      - name: stop_arrivals_count
        description: Number of int_stop_arrivals rows for this status date and mode.
      - name: latest_gtfs_snapshot_id
        description: Latest GTFS snapshot ID currently present in raw_gtfs_snapshots when the status mart was built.
      - name: latest_gtfs_snapshot_at
        description: Timestamp of the latest GTFS snapshot currently present in raw_gtfs_snapshots when the status mart was built.
      - name: gtfs_snapshot_age_hours
        description: Age in whole hours of latest_gtfs_snapshot_at at status mart build time.
      - name: schedule_versions_active
        description: Number of distinct schedule_version_id values present in settled agg_service_coverage rows for this date and mode.
      - name: last_export_at
        description: Timestamp of the last serving export that included this row. Null until the serving export job is implemented.
      - name: status_generated_at
        description: Timestamp when this status mart table was generated.

  - name: agg_line_stop_period
    description: Precomputed strict-quality delay distribution by line, direction, archive-safe headsign, stop post, scheduled Warsaw-local hour, period, and day class. Normal builds replace affected month and schedule-version period_start_date partitions. Built only from fct_stop_arrival rows where trip_quality = 'complete'.
    columns:
      - name: period_type
        description: Aggregate period family. Values are month and schedule_version. Month rows use only the latest schedule_version_id observed in that month for each line, direction_id, and schedule_day_type, ordered by dim_schedule_version.valid_from_date.
      - name: period_id
        description: Period identifier. Calendar months use YYYY-MM; schedule-version rows use schedule_version_id.
      - name: period_start_date
        description: First service date in the period. Month rows use the first day of the month; schedule-version rows use dim_schedule_version.valid_from_date.
      - name: period_end_date
        description: Last service date in the period. Open-ended schedule versions have null period_end_date.
      - name: source_start_date
        description: Earliest source service_date included in this aggregate cell.
      - name: source_end_date
        description: Latest source service_date included in this aggregate cell.
      - name: is_partial_period
        description: True when the source date range does not cover the natural period bounds, such as a current month before month end or a bounded rebuild that starts after a schedule version began. Open-ended schedule-version rows use source_end_date as their observed-through date.
      - name: day_class_type
        description: Day-class family used for this row. Values are day_type, weekday, and schedule_day_type.
      - name: day_class
        description: Day-class value, such as weekday, weekend, monday, or the GTFS-derived schedule_day_type. Holiday schedule grouping is represented through schedule_day_type rows.
      - name: schedule_version_id
        description: Timetable-version identifier preserved in the aggregate grain for archive-safe schedule lineage.
      - name: line
        description: Public line identifier from the label-bearing stop-arrival fact.
      - name: route_short_name
        description: Public route short name baked onto the source fact from the governing GTFS snapshot.
      - name: mode
        description: Transit mode baked onto the source fact.
      - name: direction_id
        description: GTFS direction_id for the matched trip.
      - name: trip_headsign
        description: Matched trip headsign baked onto the source fact from the governing GTFS snapshot.
      - name: stop_group_id
        description: User-facing stop group identifier derived from the stop post.
      - name: stop_group_name
        description: Archive-safe stop group display name baked onto the source fact.
      - name: stop_id
        description: Physical stop/location identifier.
      - name: stop_name
        description: Archive-safe stop/location display name baked onto the source fact.
      - name: stop_lat
        description: Stop latitude from the governing GTFS snapshot.
      - name: stop_lon
        description: Stop longitude from the governing GTFS snapshot.
      - name: hour_bracket
        description: Scheduled Warsaw-local hour of day, from 0 to 23.
      - name: n
        description: Number of strict-quality stop-arrival rows in the aggregate cell.
      - name: mean_delay_seconds
        description: Average delay in seconds. Positive values are late; negative values are early.
      - name: p10_delay_seconds
        description: Approximate 10th percentile delay in seconds.
      - name: median_delay_seconds
        description: Approximate median delay in seconds.
      - name: p50_delay_seconds
        description: Approximate 50th percentile delay in seconds, retained for percentile naming consistency.
      - name: p90_delay_seconds
        description: Approximate 90th percentile delay in seconds.
      - name: stddev_delay_seconds
        description: Sample standard deviation of delay_seconds. Null when the aggregate cell has one row.
      - name: on_time_rate
        description: Share of rows with delay_seconds between -60 and 180 inclusive.
      - name: delay_histogram
        description: Fixed delay bucket counts as array<struct<bucket_label string, min_delay_seconds int64, max_delay_seconds int64, n int64>>. Buckets are early_over_5m (< -300, null min), early_1_to_5m (-300..-61), on_time (-60..180), late_3_to_5m (181..300), late_5_to_10m (301..600), late_10_to_20m (601..1200), and late_over_20m (> 1200, null max).
      - name: gtfs_snapshot_ids
        description: Distinct governing GTFS snapshot IDs contributing source rows to this aggregate cell.

  - name: agg_stop_period
    description: Precomputed strict-quality delay distribution by stop group, line, direction, archive-safe headsign, scheduled Warsaw-local hour, period, and day class. Normal builds replace affected month and schedule-version period_start_date partitions. Direction stays explicit because schedule versions are per line and direction.
    columns:
      - name: period_type
        description: Aggregate period family. Values are month and schedule_version. Month rows use only the latest schedule_version_id observed in that month for each line, direction_id, and schedule_day_type, ordered by dim_schedule_version.valid_from_date.
      - name: period_id
        description: Period identifier. Calendar months use YYYY-MM; schedule-version rows use schedule_version_id.
      - name: period_start_date
        description: First service date in the period.
      - name: period_end_date
        description: Last service date in the period. Open-ended schedule versions have null period_end_date.
      - name: source_start_date
        description: Earliest source service_date included in this aggregate cell.
      - name: source_end_date
        description: Latest source service_date included in this aggregate cell.
      - name: is_partial_period
        description: True when the source date range does not cover the natural period bounds, such as a current month before month end or a bounded rebuild that starts after a schedule version began. Open-ended schedule-version rows use source_end_date as their observed-through date.
      - name: day_class_type
        description: Day-class family used for this row. Values are day_type, weekday, and schedule_day_type.
      - name: day_class
        description: Day-class value, including weekday/weekend, per-weekday names, and GTFS-derived schedule_day_type values for holiday schedule grouping.
      - name: schedule_version_id
        description: Timetable-version identifier preserved in the aggregate grain for archive-safe schedule lineage.
      - name: stop_group_id
        description: User-facing stop group identifier.
      - name: stop_group_name
        description: Archive-safe stop group display name baked onto the source fact.
      - name: line
        description: Public line identifier from the source fact.
      - name: route_short_name
        description: Public route short name baked onto the source fact from the governing GTFS snapshot.
      - name: mode
        description: Transit mode baked onto the source fact.
      - name: direction_id
        description: GTFS direction_id for the matched trip.
      - name: trip_headsign
        description: Matched trip headsign baked onto the source fact from the governing GTFS snapshot.
      - name: hour_bracket
        description: Scheduled Warsaw-local hour of day, from 0 to 23.
      - name: n
        description: Number of strict-quality stop-arrival rows in the aggregate cell.
      - name: mean_delay_seconds
        description: Average delay in seconds. Positive values are late; negative values are early.
      - name: p10_delay_seconds
        description: Approximate 10th percentile delay in seconds.
      - name: median_delay_seconds
        description: Approximate median delay in seconds.
      - name: p50_delay_seconds
        description: Approximate 50th percentile delay in seconds, retained for percentile naming consistency.
      - name: p90_delay_seconds
        description: Approximate 90th percentile delay in seconds.
      - name: stddev_delay_seconds
        description: Sample standard deviation of delay_seconds. Null when the aggregate cell has one row.
      - name: on_time_rate
        description: Share of rows with delay_seconds between -60 and 180 inclusive.
      - name: delay_histogram
        description: Fixed delay bucket counts as array<struct<bucket_label string, min_delay_seconds int64, max_delay_seconds int64, n int64>> using the shared aggregate bucket contract documented in docs/warehouse.md.
      - name: gtfs_snapshot_ids
        description: Distinct governing GTFS snapshot IDs contributing source rows to this aggregate cell.

  - name: agg_time_period
    description: Precomputed strict-quality time-of-day delay distribution by scheduled Warsaw-local hour, day class, period, and mode. Normal builds replace affected month and schedule-version period_start_date partitions. Month rows are network-wide within mode; schedule-version rows are line/direction/headsign-scoped because schedule_version_id is a per-line concept.
    columns:
      - name: period_type
        description: Aggregate period family. Values are month and schedule_version. Month rows use only the latest schedule_version_id observed in that month for each line, direction_id, and schedule_day_type, ordered by dim_schedule_version.valid_from_date, before network-wide grouping.
      - name: period_id
        description: Period identifier. Calendar months use YYYY-MM; schedule-version rows use schedule_version_id.
      - name: period_start_date
        description: First service date in the period.
      - name: period_end_date
        description: Last service date in the period. Open-ended schedule versions have null period_end_date.
      - name: source_start_date
        description: Earliest source service_date included in this aggregate cell.
      - name: source_end_date
        description: Latest source service_date included in this aggregate cell.
      - name: is_partial_period
        description: True when the source date range does not cover the natural period bounds, such as a current month before month end or a bounded rebuild that starts after a schedule version began. Open-ended schedule-version rows use source_end_date as their observed-through date.
      - name: day_class_type
        description: Day-class family used for this row. Values are day_type, weekday, and schedule_day_type.
      - name: day_class
        description: Day-class value, including weekday/weekend, per-weekday names, and GTFS-derived schedule_day_type values.
      - name: mode
