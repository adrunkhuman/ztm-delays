      - name: line
        description: Public line identifier for schedule-version rows. Null for network-wide month rows.
      - name: route_short_name
        description: Route short name for schedule-version rows. Null for network-wide month rows.
      - name: direction_id
        description: GTFS direction_id for schedule-version rows. Null for network-wide month rows.
      - name: trip_headsign
        description: Trip headsign for schedule-version rows. Null for network-wide month rows.
      - name: schedule_version_id
        description: Timetable-version identifier for schedule-version rows. Null for network-wide month rows.
      - name: hour_bracket
        description: Scheduled Warsaw-local hour of day, from 0 to 23.
      - name: n
        description: Number of strict-quality stop-arrival rows in the aggregate cell.
      - name: mean_delay_seconds
        description: Average delay in seconds. Positive values are late; negative values are early.
      - name: p10_delay_seconds
        description: Approximate 10th percentile delay in seconds.
      - name: median_delay_seconds
        description: Approximate median delay in seconds.
      - name: p50_delay_seconds
        description: Approximate 50th percentile delay in seconds, retained for percentile naming consistency.
      - name: p90_delay_seconds
        description: Approximate 90th percentile delay in seconds.
      - name: stddev_delay_seconds
        description: Sample standard deviation of delay_seconds. Null when the aggregate cell has one row.
      - name: on_time_rate
        description: Share of rows with delay_seconds between -60 and 180 inclusive.
      - name: delay_histogram
        description: Fixed delay bucket counts using the shared aggregate bucket contract documented in docs/warehouse.md.
      - name: gtfs_snapshot_ids
        description: Distinct governing GTFS snapshot IDs contributing source rows to this aggregate cell.

  - name: agg_line_daily
    description: Daily strict-quality line, direction, and archive-safe headsign summary for trend browsing. Normal builds replace the inclusive aggregation_start_date-through-processing_date service-date partitions. Delay statistics are computed from fct_stop_arrival rows where trip_quality = 'complete'; trip_count counts distinct observed trips in those rows. Daily rows keep every observed schedule_version_id because there is no separate daily schedule-version period fallback.
