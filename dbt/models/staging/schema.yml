version: 2

models:
  - name: stg_gps__pings
    description: Cleaned, deduplicated GPS pings for one Warsaw-local processing date.
    columns:
      - name: line
        tests:
          - not_null:
              config:
                where: "gps_date = date('{{ var(\"processing_date\", \"1970-01-01\") }}')"
      - name: brigade
        tests:
          - not_null:
              config:
                where: "gps_date = date('{{ var(\"processing_date\", \"1970-01-01\") }}')"
      - name: lat
        tests:
          - not_null:
              config:
                where: "gps_date = date('{{ var(\"processing_date\", \"1970-01-01\") }}')"
      - name: lon
        tests:
          - not_null:
              config:
                where: "gps_date = date('{{ var(\"processing_date\", \"1970-01-01\") }}')"
      - name: gps_time
        tests:
          - not_null:
              config:
                where: "gps_date = date('{{ var(\"processing_date\", \"1970-01-01\") }}')"
      - name: vehicle_number
        tests:
          - not_null:
              config:
                where: "gps_date = date('{{ var(\"processing_date\", \"1970-01-01\") }}')"
      - name: vehicle_type
        tests:
          - not_null:
              config:
                where: "gps_date = date('{{ var(\"processing_date\", \"1970-01-01\") }}')"
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
              config:
                where: "gps_date = date('{{ var(\"processing_date\", \"1970-01-01\") }}')"
      - name: ingested_at
        tests:
          - not_null:
              config:
                where: "gps_date = date('{{ var(\"processing_date\", \"1970-01-01\") }}')"
      - name: gps_date
        tests: [not_null]

  - name: stg_gtfs__trips
    description: GTFS trips spanning all loaded snapshots. Downstream models choose the governing snapshot explicitly.
    columns:
      - name: trip_id
        tests: [not_null]
      - name: line
        tests: [not_null]
      - name: service_id
        tests: [not_null]
      - name: trip_headsign
      - name: direction_id
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: block_id
        description: GTFS block_id when provided by the feed. This is the preferred duty-chain identity for schedule-spine models.
      - name: block_short_name
        description: Public block or brigade short name from GTFS before normalization.
      - name: brigade
        tests: [not_null]
      - name: shape_id
        tests: [not_null]
      - name: gtfs_snapshot_id
        tests: [not_null]

  - name: stg_gtfs__stop_times
    description: GTFS stop times spanning all loaded snapshots, with schedule times converted to seconds since GTFS service-day midnight. Values can exceed 86400 for overnight service.
    columns:
      - name: trip_id
        tests: [not_null]
      - name: stop_id
        tests: [not_null]
      - name: stop_sequence
        tests: [not_null]
      - name: arrival_time_seconds
        tests: [not_null]
      - name: departure_time_seconds
        tests: [not_null]
      - name: pickup_type
        description: GTFS pickup_type normalized to 0 when omitted. Current Warsaw snapshots use 0, 1, and 3.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
      - name: drop_off_type
        description: GTFS drop_off_type normalized to 0 when omitted. Current Warsaw snapshots use 0, 1, and 3.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
      - name: stop_service_class
        description: "Passenger-service class derived from GTFS pickup/drop-off rules: regular, request, or not_in_passenger_service."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['regular', 'request', 'not_in_passenger_service']
      - name: gtfs_snapshot_id
        tests: [not_null]

  - name: stg_gtfs__stops
    description: GTFS stops spanning all loaded snapshots, after dropping structurally impossible coordinates.
    columns:
      - name: stop_id
        tests: [not_null]
      - name: stop_name
        tests: [not_null]
      - name: stop_code
        description: Raw GTFS stop_code metadata. Not the same as derived stop_post_code.
      - name: stop_lat
        tests: [not_null]
      - name: stop_lon
        tests: [not_null]
      - name: zone_id
        description: Raw GTFS fare-zone metadata from stops.txt.
      - name: effective_zone_id
        description: Simplified fare-zone bucket for consumers; exact raw 1+2 boundary stops are treated as zone 1 and all other values pass through unchanged.
      - name: stop_name_stem
        description: Warsaw feed stop-name stem metadata.
      - name: town_name
        description: Warsaw feed locality name. Current feed uses Warszawa for Warsaw-proper stops.
      - name: gtfs_snapshot_id
        tests: [not_null]

  - name: stg_gtfs__shapes
    description: GTFS shape points spanning all loaded snapshots, after dropping structurally impossible coordinates.
    columns:
      - name: shape_id
        tests: [not_null]
      - name: shape_pt_lat
        tests: [not_null]
      - name: shape_pt_lon
        tests: [not_null]
      - name: shape_pt_sequence
        tests: [not_null]
      - name: gtfs_snapshot_id
        tests: [not_null]

  - name: stg_gtfs__routes
    description: GTFS routes spanning all loaded snapshots, with route_type mapped to a readable mode.
    columns:
      - name: route_id
        tests: [not_null]
      - name: route_short_name
        tests: [not_null]
      - name: route_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
      - name: mode
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['tram', 'metro', 'rail', 'bus']
      - name: gtfs_snapshot_id
        tests: [not_null]

  - name: stg_gtfs__calendar_dates
    description: GTFS service dates spanning all loaded snapshots, limited to active service additions.
    columns:
      - name: service_id
        tests: [not_null]
      - name: service_date
        tests: [not_null]
      - name: exception_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1]
                quote: false
      - name: day_type
        description: Calendar weekday/weekend class derived from service_date; not a transit schedule pattern. Use dim_schedule_date.schedule_day_type for GTFS service-pattern grouping.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['weekday', 'weekend']
      - name: gtfs_snapshot_id
        tests: [not_null]

unit_tests:
  - name: stg_gps__pings_filters_normalizes_deduplicates_and_drops_bad_coordinates
    model: stg_gps__pings
    overrides:
      vars:
        processing_date: '2026-01-15'
    given:
      - input: source('raw', 'raw_gps_pings')
        format: sql
        rows: |
          select '187' as Lines, '0012' as Brigade, 52.2297 as Lat, 21.0122 as Lon, timestamp('2026-01-15 11:00:00+00:00') as Time, '1234' as VehicleNumber, 1 as vehicle_type, timestamp('2026-01-15 11:01:00+00:00') as ingested_at
          union all select '187', '0012', 52.2297, 21.0122, timestamp('2026-01-15 11:00:00+00:00'), '1234', 1, timestamp('2026-01-15 11:02:00+00:00')
          union all select '187', 'D21', 52.2297, 21.0122, timestamp('2026-01-15 11:03:00+00:00'), '1235', 1, timestamp('2026-01-15 11:04:00+00:00')
          union all select '187', '0013', 52.2297, 21.0122, timestamp('2026-01-15 11:05:00+00:00'), 'd. 35154', 1, timestamp('2026-01-15 11:06:00+00:00')
          union all select 'L19', '0772', 107.5736318, 21.0689015, timestamp('2026-01-15 11:07:00+00:00'), '35153', 1, timestamp('2026-01-15 11:08:00+00:00')
    expect:
      rows:
        - line: '187'
          brigade: '12'
          lat: 52.2297
          lon: 21.0122
          gps_time: '2026-01-15 11:00:00+00:00'
          vehicle_number: '1234'
          vehicle_type: 1
          ingested_at: '2026-01-15 11:02:00+00:00'
          gps_date: '2026-01-15'

  - name: stg_gps__pings_uses_warsaw_local_processing_date
    model: stg_gps__pings
    overrides:
      vars:
        processing_date: '2026-01-15'
    given:
      - input: source('raw', 'raw_gps_pings')
        format: sql
        rows: |
          select '517' as Lines, '0007' as Brigade, 52.2297 as Lat, 21.0122 as Lon, timestamp('2026-01-14 23:30:00+00:00') as Time, '4321' as VehicleNumber, 1 as vehicle_type, timestamp('2026-01-14 23:31:00+00:00') as ingested_at
          union all select '517', '0008', 52.2297, 21.0122, timestamp('2026-01-15 23:30:00+00:00'), '4322', 1, timestamp('2026-01-15 23:31:00+00:00')
    expect:
      rows:
        - line: '517'
          brigade: '7'
          lat: 52.2297
          lon: 21.0122
          gps_time: '2026-01-14 23:30:00+00:00'
          vehicle_number: '4321'
          vehicle_type: 1
          ingested_at: '2026-01-14 23:31:00+00:00'
          gps_date: '2026-01-15'

  - name: stg_gtfs__trips_spans_snapshots_and_renames_brigade
    model: stg_gtfs__trips
    given:
      - input: source('raw', 'raw_gtfs_trips')
        format: sql
        rows: |
          select 'trip-old' as trip_id, '187' as route_id, 'svc-old' as service_id, 'Old' as trip_headsign, 0 as direction_id, 'block-old' as block_id, '10' as block_short_name, 'shape-old' as shape_id, 'snapshot-old' as gtfs_snapshot_id
          union all select 'trip-valid', '187', 'svc-valid', 'Valid', 1, 'block-valid', '0012', 'shape-valid', 'snapshot-valid'
          union all select 'trip-future', '187', 'svc-future', 'Future', 0, 'block-future', '14', 'shape-future', 'snapshot-future'
          union all select 'trip-empty-block', '187', 'svc-empty', 'Empty Block', 0, '', '', 'shape-empty', 'snapshot-valid'
    expect:
      rows:
        - {trip_id: 'trip-old', line: '187', service_id: 'svc-old', trip_headsign: 'Old', direction_id: 0, block_id: 'block-old', block_short_name: '10', brigade: '10', shape_id: 'shape-old', gtfs_snapshot_id: 'snapshot-old'}
        - {trip_id: 'trip-valid', line: '187', service_id: 'svc-valid', trip_headsign: 'Valid', direction_id: 1, block_id: 'block-valid', block_short_name: '0012', brigade: '12', shape_id: 'shape-valid', gtfs_snapshot_id: 'snapshot-valid'}
        - {trip_id: 'trip-future', line: '187', service_id: 'svc-future', trip_headsign: 'Future', direction_id: 0, block_id: 'block-future', block_short_name: '14', brigade: '14', shape_id: 'shape-future', gtfs_snapshot_id: 'snapshot-future'}
        - {trip_id: 'trip-empty-block', line: '187', service_id: 'svc-empty', trip_headsign: 'Empty Block', direction_id: 0, block_id: null, block_short_name: null, brigade: '0', shape_id: 'shape-empty', gtfs_snapshot_id: 'snapshot-valid'}

  - name: stg_gtfs__stop_times_converts_overnight_times_to_seconds
    model: stg_gtfs__stop_times
    given:
      - input: source('raw', 'raw_gtfs_stop_times')
        format: sql
        rows: |
          select 'trip-1' as trip_id, '401002' as stop_id, 7 as stop_sequence, '25:03:04' as arrival_time, '25:04:05' as departure_time, 3 as pickup_type, 3 as drop_off_type, 'snapshot-valid' as gtfs_snapshot_id
          union all select 'trip-1', '401003', 8, '25:05:04', '25:06:05', 1, 1, 'snapshot-valid'
          union all select 'trip-1', '401004', 9, '25:07:04', '25:08:05', null, null, 'snapshot-valid'
          union all select 'trip-1', '401005', 10, '25:09:04', '25:10:05', 1, 0, 'snapshot-valid'
          union all select 'trip-1', '401006', 11, '25:11:04', '25:12:05', 0, 1, 'snapshot-valid'
          union all select 'trip-1', '401007', 12, '25:13:04', '25:14:05', 3, 0, 'snapshot-valid'
          union all select 'trip-1', '401008', 13, '25:15:04', '25:16:05', 0, 3, 'snapshot-valid'
    expect:
      rows:
        - trip_id: 'trip-1'
          stop_id: '401002'
          stop_sequence: 7
          arrival_time_seconds: 90184
          departure_time_seconds: 90245
          pickup_type: 3
          drop_off_type: 3
          stop_service_class: request
          gtfs_snapshot_id: 'snapshot-valid'
        - trip_id: 'trip-1'
          stop_id: '401003'
          stop_sequence: 8
          arrival_time_seconds: 90304
          departure_time_seconds: 90365
          pickup_type: 1
          drop_off_type: 1
          stop_service_class: not_in_passenger_service
          gtfs_snapshot_id: 'snapshot-valid'
        - trip_id: 'trip-1'
          stop_id: '401004'
          stop_sequence: 9
          arrival_time_seconds: 90424
          departure_time_seconds: 90485
          pickup_type: 0
          drop_off_type: 0
          stop_service_class: regular
          gtfs_snapshot_id: 'snapshot-valid'
        - trip_id: 'trip-1'
          stop_id: '401005'
          stop_sequence: 10
          arrival_time_seconds: 90544
          departure_time_seconds: 90605
          pickup_type: 1
          drop_off_type: 0
          stop_service_class: regular
          gtfs_snapshot_id: 'snapshot-valid'
        - trip_id: 'trip-1'
          stop_id: '401006'
          stop_sequence: 11
          arrival_time_seconds: 90664
          departure_time_seconds: 90725
          pickup_type: 0
          drop_off_type: 1
          stop_service_class: regular
          gtfs_snapshot_id: 'snapshot-valid'
        - trip_id: 'trip-1'
          stop_id: '401007'
          stop_sequence: 12
          arrival_time_seconds: 90784
          departure_time_seconds: 90845
          pickup_type: 3
          drop_off_type: 0
          stop_service_class: request
          gtfs_snapshot_id: 'snapshot-valid'
        - trip_id: 'trip-1'
          stop_id: '401008'
          stop_sequence: 13
          arrival_time_seconds: 90904
          departure_time_seconds: 90965
          pickup_type: 0
          drop_off_type: 3
          stop_service_class: request
          gtfs_snapshot_id: 'snapshot-valid'

  - name: stg_gtfs__stops_spans_snapshots_and_drops_bad_coordinates
    model: stg_gtfs__stops
    given:
      - input: source('raw', 'raw_gtfs_stops')
        format: sql
        rows: |
          select '401001' as stop_id, 'Old Stop' as stop_name, '01' as stop_code, 52.1 as stop_lat, 21.1 as stop_lon, '1+2' as zone_id, 'Old' as stop_name_stem, 'Warszawa' as town_name, 'snapshot-old' as gtfs_snapshot_id
          union all select '401002', 'Valid Stop', '02', 52.2, 21.2, '2', 'Valid', 'Piaseczno', 'snapshot-valid'
          union all select '401004', 'Blank Zone Stop', '04', 52.4, 21.4, '', 'Blank Zone', 'Warszawa', 'snapshot-valid'
          union all select '401003', 'Bad Stop', '03', 107.5, 21.3, '1', 'Bad', 'Warszawa', 'snapshot-valid'
    expect:
      rows:
        - {stop_id: '401001', stop_name: 'Old Stop', stop_code: '01', stop_lat: 52.1, stop_lon: 21.1, zone_id: '1+2', effective_zone_id: '1', stop_name_stem: 'Old', town_name: 'Warszawa', gtfs_snapshot_id: 'snapshot-old'}
        - {stop_id: '401002', stop_name: 'Valid Stop', stop_code: '02', stop_lat: 52.2, stop_lon: 21.2, zone_id: '2', effective_zone_id: '2', stop_name_stem: 'Valid', town_name: 'Piaseczno', gtfs_snapshot_id: 'snapshot-valid'}
        - {stop_id: '401004', stop_name: 'Blank Zone Stop', stop_code: '04', stop_lat: 52.4, stop_lon: 21.4, zone_id: '', effective_zone_id: '', stop_name_stem: 'Blank Zone', town_name: 'Warszawa', gtfs_snapshot_id: 'snapshot-valid'}

  - name: stg_gtfs__shapes_spans_snapshots
    model: stg_gtfs__shapes
    given:
      - input: source('raw', 'raw_gtfs_shapes')
        format: sql
        rows: |
          select 'shape-old' as shape_id, 52.1 as shape_pt_lat, 21.1 as shape_pt_lon, 1 as shape_pt_sequence, 'snapshot-old' as gtfs_snapshot_id
          union all select 'shape-valid', 52.2, 21.2, 2, 'snapshot-valid'
    expect:
      rows:
        - {shape_id: 'shape-old', shape_pt_lat: 52.1, shape_pt_lon: 21.1, shape_pt_sequence: 1, gtfs_snapshot_id: 'snapshot-old'}
        - {shape_id: 'shape-valid', shape_pt_lat: 52.2, shape_pt_lon: 21.2, shape_pt_sequence: 2, gtfs_snapshot_id: 'snapshot-valid'}

  - name: stg_gtfs__routes_adds_mode
    model: stg_gtfs__routes
    given:
      - input: source('raw', 'raw_gtfs_routes')
        format: sql
        rows: |
          select 'bus' as route_id, '187' as route_short_name, 3 as route_type, 'snapshot-valid' as gtfs_snapshot_id
          union all select 'tram', '9', 0, 'snapshot-valid'
    expect:
      rows:
        - {route_id: 'bus', route_short_name: '187', route_type: 3, mode: 'bus', gtfs_snapshot_id: 'snapshot-valid'}
        - {route_id: 'tram', route_short_name: '9', route_type: 0, mode: 'tram', gtfs_snapshot_id: 'snapshot-valid'}

  - name: stg_gtfs__calendar_dates_derives_day_type
    model: stg_gtfs__calendar_dates
    given:
      - input: source('raw', 'raw_gtfs_calendar_dates')
        format: sql
        rows: |
          select 'svc-weekend' as service_id, date '2026-01-17' as `date`, 1 as exception_type, 'snapshot-valid' as gtfs_snapshot_id
          union all select 'svc-weekday', date '2026-01-19', 1, 'snapshot-valid'
          union all select 'svc-removed', date '2026-01-20', 2, 'snapshot-valid'
    expect:
      rows:
        - {service_id: 'svc-weekend', service_date: '2026-01-17', exception_type: 1, day_type: 'weekend', gtfs_snapshot_id: 'snapshot-valid'}
        - {service_id: 'svc-weekday', service_date: '2026-01-19', exception_type: 1, day_type: 'weekday', gtfs_snapshot_id: 'snapshot-valid'}
