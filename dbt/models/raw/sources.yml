version: 2

sources:
  - name: raw
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'ztm-data') }}"
    schema: "{{ env_var('DBT_BIGQUERY_DATASET', 'ztm_bq') }}"
    tables:
      - name: raw_gps_pings
        description: Raw GPS pings loaded from poller Parquet files.
        config:
          loaded_at_field: ingested_at
          freshness:
            warn_after:
              count: 20
              period: minute
            error_after:
              count: 40
              period: minute
        columns:
          - name: Lines
            tests:
              - not_null
          - name: Brigade
            tests:
              - not_null
          - name: Lat
            tests:
              - not_null
          - name: Lon
            tests:
              - not_null
          - name: Time
            tests:
              - not_null
          - name: VehicleNumber
            tests:
              - not_null
          - name: vehicle_type
            tests:
              - not_null
          - name: ingested_at
            tests:
              - not_null
      - name: raw_gtfs_snapshots
        description: Metadata for retained GTFS ZIP snapshots.
        columns:
          - name: snapshot_id
            tests:
              - not_null
              - unique
          - name: snapshot_timestamp
            tests:
              - not_null
          - name: file_hash
            tests:
              - not_null
          - name: gcs_path
            tests:
              - not_null
      - name: raw_gtfs_trips
        description: Raw trips.txt rows loaded from GTFS snapshots.
        columns:
          - name: trip_id
            tests:
              - not_null
          - name: route_id
            tests:
              - not_null
          - name: service_id
            tests:
              - not_null
          - name: gtfs_snapshot_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'raw_gtfs_snapshots')
                    field: snapshot_id
      - name: raw_gtfs_stop_times
        description: Raw stop_times.txt rows loaded from GTFS snapshots.
        columns:
          - name: trip_id
            tests:
              - not_null
          - name: stop_id
            tests:
              - not_null
          - name: stop_sequence
            tests:
              - not_null
          - name: arrival_time
            tests:
              - not_null
          - name: departure_time
            tests:
              - not_null
          - name: gtfs_snapshot_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'raw_gtfs_snapshots')
                    field: snapshot_id
      - name: raw_gtfs_stops
        description: Raw stops.txt rows loaded from GTFS snapshots.
        columns:
          - name: stop_id
            tests:
              - not_null
          - name: stop_name
            tests:
              - not_null
          - name: gtfs_snapshot_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'raw_gtfs_snapshots')
                    field: snapshot_id
      - name: raw_gtfs_shapes
        description: Raw shapes.txt rows loaded from GTFS snapshots.
        columns:
          - name: shape_id
            tests:
              - not_null
          - name: shape_pt_sequence
            tests:
              - not_null
          - name: gtfs_snapshot_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'raw_gtfs_snapshots')
                    field: snapshot_id
      - name: raw_gtfs_routes
        description: Raw routes.txt rows loaded from GTFS snapshots.
        columns:
          - name: route_id
            tests:
              - not_null
          - name: route_short_name
            tests:
              - not_null
          - name: route_type
            tests:
              - not_null
          - name: gtfs_snapshot_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'raw_gtfs_snapshots')
                    field: snapshot_id
      - name: raw_gtfs_calendar_dates
        description: Raw calendar_dates.txt rows loaded from GTFS snapshots.
        columns:
          - name: service_id
            tests:
              - not_null
          - name: date
            tests:
              - not_null
          - name: exception_type
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [1, 2]
                    quote: false
          - name: gtfs_snapshot_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'raw_gtfs_snapshots')
                    field: snapshot_id
