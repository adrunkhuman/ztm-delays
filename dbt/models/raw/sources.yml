version: 2

sources:
  - name: raw
    database: "{{ env_var('GCP_PROJECT', 'ztm-data') }}"
    schema: "{{ env_var('BIGQUERY_RAW_DATASET', 'ztm_raw') }}"
    tables:
      - name: raw_gps_pings
        description: Raw GPS pings loaded from poller Parquet files.
        config:
          loaded_at_field: ingested_at
          freshness:
            warn_after:
              count: 20
              period: minute
            error_after:
              count: 40
              period: minute
        columns:
          - name: Lines
            tests:
              - not_null:
                  config: &raw_gps_processing_date_filter
                    where: "Time >= timestamp(date('{{ var(\"processing_date\", \"1970-01-01\") }}'), 'Europe/Warsaw') and Time < timestamp(date_add(date('{{ var(\"processing_date\", \"1970-01-01\") }}'), interval 1 day), 'Europe/Warsaw')"
          - name: Brigade
            tests:
              - not_null:
                  config: *raw_gps_processing_date_filter
          - name: Lat
            tests:
              - not_null:
                  config: *raw_gps_processing_date_filter
          - name: Lon
            tests:
              - not_null:
                  config: *raw_gps_processing_date_filter
          - name: Time
            tests:
              - not_null:
                  config:
                    where: "Time is null"
          - name: VehicleNumber
            tests:
              - not_null:
                  config: *raw_gps_processing_date_filter
          - name: vehicle_type
            tests:
              - not_null:
                  config: *raw_gps_processing_date_filter
          - name: ingested_at
            tests:
              - not_null:
                  config: *raw_gps_processing_date_filter
      - name: raw_gtfs_snapshots
        description: Metadata for retained GTFS ZIP snapshots.
        columns:
          - name: snapshot_id
            tests:
              - not_null
              - unique
          - name: snapshot_timestamp
            tests:
              - not_null
          - name: file_hash
            tests:
              - not_null
          - name: gcs_path
            tests:
              - not_null
      - name: raw_gtfs_trips
        description: Raw trips.txt rows loaded from GTFS snapshots.
        columns:
          - name: trip_id
            tests:
              - not_null
          - name: route_id
            tests:
              - not_null
          - name: service_id
            tests:
              - not_null
          - name: gtfs_snapshot_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'raw_gtfs_snapshots')
                    field: snapshot_id
      - name: raw_gtfs_stop_times
        description: Raw stop_times.txt rows loaded from GTFS snapshots.
        columns:
          - name: trip_id
            tests:
              - not_null
          - name: stop_id
            tests:
              - not_null
          - name: stop_sequence
            tests:
              - not_null
          - name: arrival_time
            tests:
              - not_null
          - name: departure_time
            tests:
              - not_null
          - name: pickup_type
            description: GTFS pickup_type. Warsaw feed currently uses 0 for regular, 1 for no pickup, and 3 for driver-arranged/request pickup.
          - name: drop_off_type
            description: GTFS drop_off_type. Warsaw feed currently uses 0 for regular, 1 for no drop-off, and 3 for driver-arranged/request drop-off.
          - name: gtfs_snapshot_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'raw_gtfs_snapshots')
                    field: snapshot_id
      - name: raw_gtfs_stops
        description: Raw stops.txt rows loaded from GTFS snapshots.
        columns:
          - name: stop_id
            tests:
              - not_null
          - name: stop_name
            tests:
              - not_null
          - name: stop_code
            description: Raw GTFS stop_code metadata from stops.txt.
          - name: platform_code
            description: Raw GTFS platform_code metadata from stops.txt.
          - name: stop_lat
          - name: stop_lon
          - name: location_type
            description: Raw GTFS location_type metadata from stops.txt.
          - name: parent_station
            description: Raw GTFS parent_station metadata from stops.txt.
          - name: wheelchair_boarding
            description: Raw GTFS wheelchair_boarding metadata from stops.txt.
          - name: zone_id
            description: Raw GTFS fare-zone metadata from stops.txt. Boundary stops can use values such as 1+2.
          - name: stop_name_stem
            description: Raw Warsaw feed stop-name stem metadata from stops.txt.
          - name: town_name
            description: Raw Warsaw feed locality name from stops.txt.
          - name: street_name
            description: Raw Warsaw feed street name from stops.txt.
          - name: gtfs_snapshot_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'raw_gtfs_snapshots')
                    field: snapshot_id
      - name: raw_gtfs_shapes
        description: Raw shapes.txt rows loaded from GTFS snapshots.
        columns:
          - name: shape_id
            tests:
              - not_null
          - name: shape_pt_sequence
            tests:
              - not_null
          - name: gtfs_snapshot_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'raw_gtfs_snapshots')
                    field: snapshot_id
      - name: raw_gtfs_routes
        description: Raw routes.txt rows loaded from GTFS snapshots.
        columns:
          - name: route_id
            tests:
              - not_null
          - name: route_short_name
            tests:
              - not_null
          - name: route_type
            tests:
              - not_null
          - name: gtfs_snapshot_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'raw_gtfs_snapshots')
                    field: snapshot_id
      - name: raw_gtfs_calendar_dates
        description: Raw calendar_dates.txt rows loaded from GTFS snapshots.
        columns:
          - name: service_id
            tests:
              - not_null
          - name: date
            tests:
              - not_null
          - name: exception_type
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [1, 2]
                    quote: false
          - name: gtfs_snapshot_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'raw_gtfs_snapshots')
                    field: snapshot_id
