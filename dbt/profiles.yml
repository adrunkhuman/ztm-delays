ztm_pipeline:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('DBT_BIGQUERY_PROJECT', 'ztm-data') }}"
      dataset: "{{ env_var('DBT_BIGQUERY_DATASET', 'ztm_bq') }}"
      location: "{{ env_var('DBT_BIGQUERY_LOCATION', 'europe-north1') }}"
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      threads: 4
      job_execution_timeout_seconds: 300
      job_retries: 1
